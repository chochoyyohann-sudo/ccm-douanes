<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QCM Douanes — Concours C</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B2E4B;--gold:#C8A84B;--bg:#F2F4F7;--surface:#fff;
  --border:#DDE1E8;--text:#1B2333;--sub:#5A6478;--muted:#9099AA;
  --green:#1E7A4E;--green-bg:#EAF5EF;--green-border:#A8D8BB;
  --red:#C0392B;--red-bg:#FCECEA;--red-border:#F5B7B1;
  --sel-bg:#E8EEF8;--sel-border:#3B6BBF;
  --radius:12px;--font:Inter,system-ui,sans-serif;
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* HEADER */
.header{background:var(--navy);border-bottom:2px solid var(--gold);position:sticky;top:0;z-index:100}
.header-inner{max-width:720px;margin:0 auto;height:52px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:30px;height:30px;background:var(--gold);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.logo-text{font-size:13px;font-weight:600;color:#fff;letter-spacing:.3px}
.logo-sub{font-size:10px;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase}
.score-chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:12px;font-weight:600;color:#fff;white-space:nowrap}
.score-chip em{color:var(--gold);font-style:normal}
.progress-track{height:3px;background:rgba(255,255,255,.12)}
.progress-fill{height:100%;background:var(--gold);transition:width .4s}

/* FILTERS */
.filters{background:var(--surface);border-bottom:1px solid var(--border)}
.filters-inner{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fsep{width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 2px}
.fbtn{font-family:var(--font);font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1.5px solid var(--border);background:transparent;color:var(--sub);cursor:pointer;transition:all .15s;white-space:nowrap}
.fbtn:hover{border-color:var(--navy);color:var(--navy)}
.fbtn.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* MAIN */
.main{max-width:720px;margin:0 auto;padding:20px 16px 40px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;text-align:center}
.stat-val{font-size:20px;font-weight:700;color:var(--navy);line-height:1.1}
.stat-val.g{color:var(--green)}
.stat-val.r{color:var(--red)}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px}

/* META */
.meta{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;border:1px solid;letter-spacing:.2px;text-transform:uppercase}
.tag-orth{background:#EEF2FF;color:#4338CA;border-color:#C7D2FE}
.tag-cult{background:#ECFDF5;color:#065F46;border-color:#A7F3D0}
.tag-calc{background:#FFF7ED;color:#C2410C;border-color:#FED7AA}
.tag-rais{background:#FDF4FF;color:#7E22CE;border-color:#E9D5FF}
.tag-leitner{font-size:10px;font-weight:600;padding:3px 9px;border-radius:20px;background:#FEF3C7;color:#92400E;border:1px solid #FDE68A}
.q-counter{font-size:11px;color:var(--muted);margin-left:auto;font-weight:500}

/* QUESTION */
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.q-text{font-size:15px;line-height:1.7;font-weight:500}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 15px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;text-align:left;width:100%;font-family:var(--font)}
.opt:hover:not(.disabled){border-color:var(--navy);background:var(--sel-bg);transform:translateY(-1px)}
.opt-num{width:26px;height:26px;min-width:26px;border-radius:7px;background:var(--bg);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);transition:all .15s;flex-shrink:0}
.opt-text{font-size:13.5px;line-height:1.5;color:var(--text);padding-top:3px}
.opt.sel{border-color:var(--sel-border);background:var(--sel-bg)}
.opt.sel .opt-num{background:var(--sel-border);border-color:var(--sel-border);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .opt-num{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .opt-num{background:var(--red);border-color:var(--red);color:#fff}
.opt.show-ok{border-color:var(--green);background:var(--green-bg)}
.opt.show-ok .opt-num{background:var(--green);border-color:var(--green);color:#fff}
.opt.disabled{cursor:default}

/* FEEDBACK */
.feedback{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-top:12px;box-shadow:0 1px 4px rgba(0,0,0,.06);animation:slideUp .2s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fb-head{padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.fb-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.fb-icon.ok{background:var(--green-bg);color:var(--green)}
.fb-icon.ko{background:var(--red-bg);color:var(--red)}
.fb-title{font-size:13px;font-weight:700}
.fb-title.ok{color:var(--green)}
.fb-title.ko{color:var(--red)}
.fb-body{padding:14px 16px}
.fb-label{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fb-text{font-size:13px;line-height:1.7;color:var(--sub)}
.spinner{width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--navy);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* ACTIONS */
.actions{display:flex;gap:8px;margin-top:14px}
.btn{font-family:var(--font);font-size:13.5px;font-weight:600;padding:11px 20px;border-radius:var(--radius);border:none;cursor:pointer;transition:opacity .15s,transform .1s}
.btn:hover{opacity:.88}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--navy);color:#fff;flex:1}
.btn-ghost{background:var(--bg);color:var(--sub);border:1px solid var(--border)}

/* LEITNER BADGE */
.leitner-bar{display:flex;gap:4px;margin-bottom:16px;align-items:center}
.leitner-bar span{font-size:11px;color:var(--muted);margin-right:4px}
.l-dot{width:10px;height:10px;border-radius:50%}

/* END SCREEN */
.end{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px 24px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.end-pct{font-size:56px;font-weight:700;color:var(--navy);line-height:1;margin-bottom:4px}
.end-msg{font-size:16px;font-weight:600;margin-bottom:6px}
.end-detail{font-size:13px;color:var(--muted);margin-bottom:20px}
.end-cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.end-cat{border-radius:10px;padding:12px 14px;text-align:left}
.end-cat-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.end-cat-bar{height:6px;border-radius:3px;background:rgba(0,0,0,.08);margin-bottom:3px}
.end-cat-fill{height:100%;border-radius:3px;transition:width .6s}
.end-cat-score{font-size:11px;color:var(--muted)}
.end-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.end-btn{font-family:var(--font);font-size:13px;font-weight:600;padding:11px 22px;border-radius:var(--radius);border:none;cursor:pointer;transition:opacity .15s}
.end-btn:hover{opacity:.88}
.end-btn-main{background:var(--navy);color:#fff}
.end-btn-sec{background:var(--bg);color:var(--sub);border:1px solid var(--border)}

/* TOOLTIP */
.difficulty-badge{font-size:9px;font-weight:600;padding:2px 6px;border-radius:10px;border:1px solid}
.d-easy{background:#DCFCE7;color:#166534;border-color:#BBF7D0}
.d-med{background:#FEF9C3;color:#854D0E;border-color:#FDE047}
.d-hard{background:#FEE2E2;color:#991B1B;border-color:#FCA5A5}

@media(max-width:480px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .end-cats{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <div class="logo-icon">⚓</div>
      <div>
        <div class="logo-text">Concours C des Douanes</div>
        <div class="logo-sub">Révision QCM · 500 questions · Annales 2022–2026</div>
      </div>
    </div>
    <div class="score-chip">Score <em id="hScore">0</em>/<em id="hTotal">0</em></div>
  </div>
  <div class="progress-track"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
</div>

<div class="filters">
  <div class="filters-inner" id="filterRow"></div>
</div>

<div class="main" id="main"></div>

<script>
// ══ DATA ════════════════════════════════════════════════════
const ALL_Q = [{"id": "o001", "cat": "Orthographe", "q": "Choisissez la forme correcte : « Les lettres qu'il a ___ »", "opts": ["écrit", "écrites", "écrits", "écrire"], "ans": 1, "exp": "Le participe passé 'écrire' s'accorde avec le COD 'les lettres' placé avant l'auxiliaire avoir."}, {"id": "o002", "cat": "Orthographe", "q": "Quelle phrase est correctement orthographiée ?", "opts": ["Elle s'est lavée les mains.", "Elle s'est lavé les mains.", "Elle s'ait lavée les mains.", "Elle c'est lavé les mains."], "ans": 1, "exp": "Quand le COD suit le verbe pronominal, le participe passé reste invariable. 'Les mains' est COD postposé."}, {"id": "o003", "cat": "Orthographe", "q": "Complétez : « Les fleurs que j'ai ___ sont belles. »", "opts": ["cueillie", "cueillis", "cueillies", "cueilli"], "ans": 2, "exp": "Le COD 'que' remplace 'les fleurs' (féminin pluriel), placé avant avoir → accord au féminin pluriel."}, {"id": "o004", "cat": "Orthographe", "q": "Choisissez la bonne orthographe : « Elles se sont ___ à la bibliothèque. »", "opts": ["rendus", "rendu", "rendues", "rendue"], "ans": 2, "exp": "Le verbe pronominal 'se rendre' : le participe s'accorde avec le sujet féminin pluriel 'elles'."}, {"id": "o005", "cat": "Orthographe", "q": "Quelle forme est correcte ? « Les documents que le directeur a ___ »", "opts": ["signé", "signés", "signée", "signées"], "ans": 1, "exp": "COD masculin pluriel ('les documents') placé avant → accord au masculin pluriel."}, {"id": "o006", "cat": "Orthographe", "q": "Complétez : « La décision qu'ils ont ___ était risquée. »", "opts": ["pris", "prise", "prises", "prendre"], "ans": 1, "exp": "'Que' reprend 'la décision' (féminin singulier) → accord au féminin singulier : 'prise'."}, {"id": "o007", "cat": "Orthographe", "q": "Choisissez la bonne orthographe : « Il ___ allé au bureau hier. »", "opts": ["c'est", "s'est", "ces", "ses"], "ans": 1, "exp": "'S'est' = pronom réfléchi 's'' + auxiliaire 'est'. 'C'est' = ce + est (présentatif)."}, {"id": "o008", "cat": "Orthographe", "q": "Complétez : « ___ votre dossier qui manque. »", "opts": ["C'est", "S'est", "Ses", "Ces"], "ans": 0, "exp": "'C'est' est le présentatif (ce + est). S'utilise pour présenter ou identifier."}, {"id": "o009", "cat": "Orthographe", "q": "Quelle phrase est correcte ?", "opts": ["Sa mère et lui sont partis.", "Sa mère et lui son partis.", "Ça mère et lui sont partis.", "Sa mère et lui sont partie."], "ans": 0, "exp": "'Sont partis' s'accorde avec le sujet pluriel 'sa mère et lui'. 'Son' est un adjectif possessif."}, {"id": "o010", "cat": "Orthographe", "q": "Complétez : « Il faut ___ présent à la réunion. »", "opts": ["être", "et", "ait", "aie"], "ans": 0, "exp": "L'infinitif 'être' s'emploie après 'faut' (verbe impersonnel)."}, {"id": "o011", "cat": "Orthographe", "q": "Choisissez : « ___ livres sont intéressants. »", "opts": ["Ses", "Ces", "C'est", "S'est"], "ans": 1, "exp": "'Ces' est un adjectif démonstratif qui accompagne un nom pluriel."}, {"id": "o012", "cat": "Orthographe", "q": "Complétez : « Je ne sais pas ___ il viendra. »", "opts": ["si", "s'y", "ci", "sy"], "ans": 0, "exp": "'Si' = conjonction de subordination introduisant une interrogative indirecte."}, {"id": "o013", "cat": "Orthographe", "q": "Quelle orthographe est correcte ? « Il ___ souvient de ce jour. »", "opts": ["ce", "se", "s'e", "cet"], "ans": 1, "exp": "'Se souvenir' est un verbe pronominal ; 'se' est le pronom réfléchi."}, {"id": "o014", "cat": "Orthographe", "q": "Complétez : « Nous partirons ___ que la pluie cesse. »", "opts": ["dès", "des", "de", "d'ès"], "ans": 0, "exp": "'Dès que' est une locution conjonctive de temps."}, {"id": "o015", "cat": "Orthographe", "q": "Choisissez la bonne forme : « Il est ___ que tu aies raison. »", "opts": ["possible", "posible", "possibe", "possibl"], "ans": 0, "exp": "'Possible' s'écrit avec 'ss' et se termine en '-ible'."}, {"id": "o016", "cat": "Orthographe", "q": "Conjuguez correctement : « Que tu ___ à l'heure ! »", "opts": ["sois", "soit", "es", "aie"], "ans": 0, "exp": "'Que' introduit un subjonctif. 'Sois' est la 2e personne du singulier du subjonctif présent d'être."}, {"id": "o017", "cat": "Orthographe", "q": "Choisissez : « Bien qu'il ___ tard, il travaille encore. »", "opts": ["soit", "est", "sois", "être"], "ans": 0, "exp": "'Bien que' est une conjonction de concession qui exige le subjonctif."}, {"id": "o018", "cat": "Orthographe", "q": "Complétez : « Je voudrais qu'elle ___ la vérité. »", "opts": ["sache", "sait", "sachez", "savoir"], "ans": 0, "exp": "'Vouloir que' régit le subjonctif. 'Sache' = subjonctif présent de 'savoir', 3e pers. sing."}, {"id": "o019", "cat": "Orthographe", "q": "Quelle est la bonne conjugaison ? « Nous ___ arrivés hier. »", "opts": ["sommes", "avons", "êtes", "sont"], "ans": 0, "exp": "'Arriver' se conjugue avec l'auxiliaire 'être' aux temps composés."}, {"id": "o020", "cat": "Orthographe", "q": "Choisissez : « Il faut que vous ___ ce rapport. »", "opts": ["rendiez", "rendez", "rendrez", "rendu"], "ans": 0, "exp": "'Falloir que' impose le subjonctif. 'Rendiez' = subjonctif présent de 'rendre', 2e pers. pl."}, {"id": "o021", "cat": "Orthographe", "q": "Complétez : « Hier, je ___ au marché avec ma sœur. »", "opts": ["suis allé", "suis aller", "ai allé", "aller"], "ans": 0, "exp": "'Aller' se conjugue avec l'auxiliaire 'être' au passé composé."}, {"id": "o022", "cat": "Orthographe", "q": "Quelle forme est correcte ? « S'il ___ beau, nous sortirons. »", "opts": ["fait", "faisait", "fera", "ferait"], "ans": 0, "exp": "Dans une conditionnelle avec 'si' + présent → futur simple dans la principale."}, {"id": "o023", "cat": "Orthographe", "q": "Conjuguez : « Si j'avais su, je ne ___ pas venu. »", "opts": ["serais", "serai", "suis", "étais"], "ans": 0, "exp": "Si + plus-que-parfait → conditionnel passé dans la principale. 'Serais venu' est correct."}, {"id": "o024", "cat": "Orthographe", "q": "Choisissez la forme correcte : « Ils ___ leur travail depuis deux heures. »", "opts": ["font", "faisaient", "feront", "feraient"], "ans": 0, "exp": "Le présent simple exprime une action en cours. 'Font' est correct ici."}, {"id": "o025", "cat": "Orthographe", "q": "Complétez : « Il ___ depuis une heure quand je suis arrivé. »", "opts": ["pleuvait", "a plu", "pleut", "pleuvra"], "ans": 0, "exp": "Action en cours dans le passé lors d'un autre événement passé → imparfait."}, {"id": "o026", "cat": "Orthographe", "q": "Quel mot signifie 'qui ne peut être nié' ?", "opts": ["indéniable", "inéniable", "indénable", "undéniable"], "ans": 0, "exp": "'Indéniable' vient de 'nier'. Préfixe 'in-' + radical 'déni-' + suffixe '-able'."}, {"id": "o027", "cat": "Orthographe", "q": "Choisissez l'orthographe correcte.", "opts": ["irrévocable", "irévocable", "irrevocable", "irrévoquable"], "ans": 0, "exp": "'Irrévocable' : préfixe 'ir-' (devant r) + 'révocable'. Double 'r' obligatoire."}, {"id": "o028", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ?", "opts": ["bénéficier", "bénéfficier", "bénéficier", "béneficier"], "ans": 0, "exp": "'Bénéficier' s'écrit avec un seul 'f' et un accent aigu sur les deux 'é'."}, {"id": "o029", "cat": "Orthographe", "q": "Choisissez le mot correctement orthographié.", "opts": ["acquiescement", "aquiescement", "acquiessement", "acqiescement"], "ans": 0, "exp": "'Acquiescement' vient d'acquiescer : 'acqu-' + 'ies' + '-cement'."}, {"id": "o030", "cat": "Orthographe", "q": "Sélectionnez l'orthographe correcte.", "opts": ["ambiguïté", "ambigüité", "ambiguité", "ambiguïtée"], "ans": 0, "exp": "'Ambiguïté' : le tréma se place sur le 'ï' pour indiquer que le 'u' et le 'i' se prononcent séparément."}, {"id": "o031", "cat": "Orthographe", "q": "Quel mot est correctement orthographié ?", "opts": ["exceptionnel", "exeptionnel", "exceptiionnel", "exceptionel"], "ans": 0, "exp": "'Exceptionnel' : 'exception' + suffixe '-nel'. Double 'n' obligatoire."}, {"id": "o032", "cat": "Orthographe", "q": "Choisissez l'orthographe correcte.", "opts": ["parallèle", "parallele", "paralèle", "parralèle"], "ans": 0, "exp": "'Parallèle' : double 'l' et accent grave sur le deuxième 'e'."}, {"id": "o033", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ?", "opts": ["référendum", "référandum", "réferendum", "referandum"], "ans": 0, "exp": "'Référendum' : deux accents aigus sur les 'é', et se termine en '-endum'."}, {"id": "o034", "cat": "Orthographe", "q": "Choisissez le mot bien orthographié.", "opts": ["asymétrique", "asimétrique", "asymmetrique", "assimétrique"], "ans": 0, "exp": "'Asymétrique' : préfixe 'a-' + 'symétrique' (un seul 's', un seul 'm')."}, {"id": "o035", "cat": "Orthographe", "q": "Sélectionnez l'orthographe correcte.", "opts": ["vraisemblable", "vraissenblable", "vraisemblabe", "vreisemblable"], "ans": 0, "exp": "'Vraisemblable' = 'vrai' + 'semblable'. Pas de lettre double dans ce mot."}, {"id": "o036", "cat": "Orthographe", "q": "Choisissez la bonne forme : « des chemises ___ »", "opts": ["bleus", "bleues", "bleu", "bleue"], "ans": 1, "exp": "'Chemises' est féminin pluriel → accord de l'adjectif au féminin pluriel : 'bleues'."}, {"id": "o037", "cat": "Orthographe", "q": "Complétez : « une veste et un pantalon ___ »", "opts": ["gris", "grise", "grises", "grix"], "ans": 0, "exp": "Quand l'adjectif qualifie deux noms de genres différents, il se met au masculin pluriel."}, {"id": "o038", "cat": "Orthographe", "q": "Quelle phrase est correcte ?", "opts": ["Des documents confidentiels ont été transmis.", "Des documents confidentielles ont été transmis.", "Des documents confidentiel ont été transmis.", "Des documents confidentials ont été transmis."], "ans": 0, "exp": "'Documents' est masculin pluriel → adjectif 'confidentiels' au masculin pluriel."}, {"id": "o039", "cat": "Orthographe", "q": "Choisissez : « des personnes ___ »", "opts": ["compétentes", "compétents", "compétente", "compétent"], "ans": 0, "exp": "'Personnes' est féminin pluriel → 'compétentes'."}, {"id": "o040", "cat": "Orthographe", "q": "Complétez : « Elle semble ___ de sa décision. »", "opts": ["satisfaite", "satisfait", "satisfaites", "satisfaits"], "ans": 0, "exp": "'Elle' est féminin singulier, l'attribut du sujet s'accorde : 'satisfaite'."}, {"id": "o041", "cat": "Orthographe", "q": "Choisissez la forme correcte : « les nouvelles ___ »", "opts": ["tout", "toutes", "tous", "toute"], "ans": 1, "exp": "'Tout' adjectif s'accorde avec 'nouvelles' (féminin pluriel) → 'toutes'."}, {"id": "o042", "cat": "Orthographe", "q": "Complétez : « ___ les agents étaient présents. »", "opts": ["Tous", "Toutes", "Tout", "Toute"], "ans": 0, "exp": "'Agents' est masculin pluriel → 'tous les agents'."}, {"id": "o043", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ? « des idées ___ »", "opts": ["originales", "originaux", "original", "originale"], "ans": 0, "exp": "'Idées' est féminin pluriel → 'originales'."}, {"id": "o044", "cat": "Orthographe", "q": "Choisissez : « des travaux ___ »", "opts": ["préliminaires", "préliminaire", "préliminaires", "préliminairs"], "ans": 0, "exp": "'Travaux' est masculin pluriel → 'préliminaires' (même forme au masc. et fém.)."}, {"id": "o045", "cat": "Orthographe", "q": "Complétez : « une organisation ___ »", "opts": ["internationale", "international", "internationales", "internationaux"], "ans": 0, "exp": "'Organisation' est féminin singulier → 'internationale'."}, {"id": "o046", "cat": "Orthographe", "q": "Quelle phrase est syntaxiquement correcte ?", "opts": ["C'est lui que je parle.", "C'est de lui que je parle.", "C'est lui dont je parle de.", "C'est lui de que je parle."], "ans": 1, "exp": "'Parler de quelqu'un' → la préposition 'de' doit être maintenue dans la relative."}, {"id": "o047", "cat": "Orthographe", "q": "Choisissez la bonne formulation.", "opts": ["Suite à votre demande, nous vous informons.", "Suites à votre demande, nous vous informons.", "Suite de votre demande, nous vous informons.", "Suité à votre demande, nous vous inform : "Complétez : « ___ dit, ce projet me plaît. »", "opts": ["Soit", "Soient", "Soi", "C'est"], "ans": 0, "exp": "'Soit dit' est une locution adverbiale figée signifiant 'pour dire les choses'."}, {"id": "o055", "cat": "Orthographe", "q": "Quelle phrase contient une erreur ?", "opts": ["Il s'agit d'un problème récurrent.", "Il s'agit d'un problème récurant.", "Le problème est récurrent.", "Ce problème récurrent mérite attention."], "ans": 1, "exp": "'Récurrent' s'écrit avec 'rr' et se termine en '-ent', pas '-ant'."}, {"id": "o056", "cat": "Orthographe", "q": "Choisissez l'orthographe correcte.", "opts": ["davantage", "d'avantage", "d'avantages", "davantages"], "ans": 0, "exp": "'Davantage' (adverbe = plus) s'écrit en un seul mot et ne prend pas de 's'."}, {"id": "o057", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ?", "opts": ["quant à", "quand à", "quand à", "cant à"], "ans": 0, "exp": "'Quant à' est une locution prépositionnelle signifiant 'en ce qui concerne'."}, {"id": "o058", "cat": "Orthographe", "q": "Complétez : « Je l'ai vu ___ »", "opts": ["hier soir", "hyer soir", "hier soir", "ier soir"], "ans": 0, "exp": "'Hier' s'écrit avec un 'h' muet initial."}, {"id": "o059", "cat": "Orthographe", "q": "Choisissez la forme correcte.", "opts": ["quel que soit", "quelque soit", "quel qu'en soit", "quelqu'en soit"], "ans": 0, "exp": "'Quel que soit' : 'quel que' en deux mots, s'accordant avec le nom qui suit."}, {"id": "o060", "cat": "Orthographe", "q": "Quelle orthographe est correcte ?", "opts": ["néanmoins", "néanmoins", "néanmoins", "neanmoins"], "ans": 0, "exp": "'Néanmoins' : adverbe de concession en un seul mot, accent grave sur 'è'."}, {"id": "o061", "cat": "Orthographe", "q": "Sélectionnez la bonne orthographe.", "opts": ["vraisemblablement", "vraissenblablement", "vreisemblablement", "vraisemblablement"], "ans": 0, "exp": "'Vraisemblablement' = 'vraisemblable' + '-ment'. Pas de lettre double anormale."}, {"id": "o062", "cat": "Orthographe", "q": "Choisissez : le mot qui s'écrit avec un accent circonflexe.", "opts": ["forêt", "foret", "fôret", "forête"], "ans": 0, "exp": "'Forêt' prend un accent circonflexe sur le 'e' (ancienne graphie avec 's' : 'forest')."}, {"id": "o063", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ?", "opts": ["consciencieux", "conscientieux", "consciencieux", "consciecieux"], "ans": 0, "exp": "'Consciencieux' : de 'conscience' + '-ieux'. Attention au 'sc' et au '-ieux' final."}, {"id": "o064", "cat": "Orthographe", "q": "Complétez : « Il agit avec ___ »", "opts": ["discernement", "discernment", "disçernement", "discernemant"], "ans": 0, "exp": "'Discernement' vient de 'discerner' : radical 'discern-' + suffixe '-ement'."}, {"id": "o065", "cat": "Orthographe", "q": "Choisissez le mot correctement orthographié.", "opts": ["succinct", "succint", "succinct", "succinxt"], "ans": 0, "exp": "'Succinct' s'écrit avec 'cc' et le 't' final est muet mais présent."}, {"id": "o066", "cat": "Orthographe", "q": "Choisissez la bonne forme verbale : « La majorité des agents ___ présente. »", "opts": ["est", "sont", "étaient", "être"], "ans": 0, "exp": "Le sujet grammatical est 'la majorité' (singulier), donc le verbe s'accorde au singulier."}, {"id": "o067", "cat": "Orthographe", "q": "Complétez : « C'est moi qui ___ chargé de ce dossier. »", "opts": ["suis", "est", "ai", "es"], "ans": 0, "exp": "Dans 'c'est moi qui', le verbe s'accorde avec 'moi' → 1ère personne du singulier."}, {"id": "o068", "cat": "Orthographe", "q": "Choisissez : « Ni lui ni elle ne ___ au courant. »", "opts": ["sont", "est", "être", "étant"], "ans": 0, "exp": "Avec 'ni...ni', si les deux sujets sont à la 3e personne, le verbe se met au pluriel."}, {"id": "o069", "cat": "Orthographe", "q": "Quelle phrase est correcte ?", "opts": ["Chacun des candidats a été reçu.", "Chacun des candidats ont été reçus.", "Chacun des candidats ont été reçu.", "Chacun des candidats a été reçus."], "ans": 0, "exp": "'Chacun' est toujour ": ["enthousiasme", "enthousiasme", "enthusiasme", "enthouziasme"], "ans": 0, "exp": "'Enthousiasme' : du grec 'enthousiasmos', avec 'th' et 'si'."}, {"id": "o144", "cat": "Orthographe", "q": "Quelle phrase est correcte ?", "opts": ["Quoiqu'il soit tard, continuons.", "Quoi qu'il soit tard, continuons.", "Quoique il est tard, continuons.", "Quoiqu'il est tard, continuons."], "ans": 0, "exp": "'Quoique' (conjonction de concession) + subjonctif. S'écrit en un mot quand il précède un verbe."}, {"id": "o145", "cat": "Orthographe", "q": "Choisissez la bonne forme.", "opts": ["Nous vous prions d'agréer nos salutations.", "Nous vous prions d'agréez nos salutations.", "Nous vous prions d'agréer nos salutation.", "Nous vous prions d'agréers nos salutations."], "ans": 0, "exp": "'D'agréer' est un infinitif après 'd'', invariable. 'Salutations' est pluriel."}, {"id": "o146", "cat": "Orthographe", "q": "Quelle est la bonne orthographe ?", "opts": ["indiscutablement", "indiscutablement", "indiscutablemant", "indiscutablemment"], "ans": 0, "exp": "'Indiscutablement' : adverbe formé d'adjectif 'indiscutable' + '-ment'."}, {"id": "o147", "cat": "Orthographe", "q": "Choisissez la phrase correcte.", "opts": ["Les données ont été analysées.", "Les données a été analysées.", "Les données ont été analysé.", "Les données ont été analysés."], "ans": 0, "exp": "'Données' est féminin pluriel, COD antéposé → accord : 'analysées'."}, {"id": "o148", "cat": "Orthographe", "q": "Sélectionnez la bonne orthographe.", "opts": ["acquittement", "acquitement", "acquittment", "acuittement"], "ans": 0, "exp": "'Acquittement' : de 'acquitter', double 't' avant le suffixe '-ement'."}, {"id": "o149", "cat": "Orthographe", "q": "Choisissez le mot bien orthographié.", "opts": ["promiscuité", "promiscuïté", "promiscuité", "promisscuité"], "ans": 0, "exp": "'Promiscuité' : de 'promiscuus' (latin), pas de tréma sur 'i'."}, {"id": "o150", "cat": "Orthographe", "q": "Quelle forme est correcte ?", "opts": ["En tant que responsable, elle a signé.", "En tant que responsable, il a signé.", "En tant que responsables, elle a signé.", "Entant que responsable, elle a signé."], "ans": 0, "exp": "'En tant que' est une locution prépositive invariable. 'Responsable' reste au singulier quand il désigne le sujet unique."}, {"id": "c001", "cat": "Culture générale", "q": "En quelle année la Révolution française a-t-elle commencé ?", "opts": ["1789", "1792", "1783", "1799"], "ans": 0, "exp": "La Révolution française débute en 1789, marquée notamment par la prise de la Bastille le 14 juillet."}, {"id": "c002", "cat": "Culture générale", "q": "Quel est le nom du traité qui mit fin à la Première Guerre mondiale ?", "opts": ["Traité de Versailles", "Traité de Paris", "Traité de Westphalie", "Traité de Berlin"], "ans": 0, "exp": "Le Traité de Versailles, signé le 28 juin 1919, mit officiellement fin à la Première Guerre mondiale."}, {"id": "c003", "cat": "Culture générale", "q": "Qui fut le premier président de la Ve République française ?", "opts": ["Charles de Gaulle", "Georges Pompidou", "René Coty", "Vincent Auriol"], "ans": 0, "exp": "Charles de Gaulle fut élu premier président de la Ve République en décembre 1958."}, {"id": "c004", "cat": "Culture générale", "q": "En quelle année la France a-t-elle aboli la peine de mort ?", "opts": ["1981", "1975", "1968", "1990"], "ans": 0, "exp": "La peine de mort a été abolie en France le 9 octobre 1981, sous la présidence de François Mitterrand."}, {"id": "c005", "cat": "Culture générale", "q": "Quel événement est commémoré le 8 mai en France ?", "opts": ["La victoire sur l'Allemagne nazie en 1945", "La fin de la guerre d'Algérie", "L'armistice de 1918", "La libération de Paris"], "ans": 0, "exp": "Le 8 mai 1945 marque la capitulation de l'Allemagne nazie et la fin de la Seconde Guerre mondiale en Europe."}, {"id": "c006", "cat": "Culture générale", "q": "Qui est l'auteur de la Déclaration des droits de l'homme et du citoyen de 1789 ?", "opts": ["Elle fut rédigée collectivement par l'Assemblée nationale constituante", "Jean-Jacques Rousseau", "Voltaire", "Montesquieu"], "ans": 0, "exp": "La DDHC de 1789 a été rédigée collectivement par l'Assemblée nationale constituante, inspirée par les philosophes des Lumières."}, {"id": "c007", "cat": "Culture générale", "q": "Quel empire Napoléon Bonaparte a-t-il fondé ?", "opts": ["Le Premier Empire français", "Le Second Empire", "L'Empire romain", "L'Empire ottoman"], "ans": 0, "exp": "Napoléon Bonaparte proclama le Premier Empire français en 1804, se couronnant lui-même Empereur."}, {"id": "c008", "cat": "Culture générale", "q": "En quelle année la France a-t-elle adopté le suffrage universel masculin ?", "opts": ["1848", "1789", "1871", "1905"], "ans": 0, "exp": "Le suffrage universel masculin fut instauré en France sous la IIe République, par le décret du 5 mars 1848."}, {"id": "c009", "cat": "Culture générale", "q": "Quel général a lancé l'Appel du 18 juin 1940 ?", "opts": ["Charles de Gaulle", "Philippe Pétain", "Henri Giraud", "Jean de Lattre de Tassigny"], "ans": 0, "exp": "Le général de Gaulle lança depuis Londres son appel à la résistance le 18 juin 1940 sur les ondes de la BBC."}, {"id": "c010", "cat": "Culture générale", "q": "Quel est le régime politique qui précéda la Ve République ?", "opts": ["La IVe République", "La IIIe République", "Le Second Empire", "La Monarchie de Juillet"], "ans": 0, "exp": "La IVe République (1946-1958) précéda la Ve République, instaurée par la Constitution du 4 octobre 1958."}, {"id": "c011", "cat": "Culture générale", "q": "Combien y a-t-il de membres au Conseil constitutionnel français ?", "opts": ["9", "7", "11", "15"], "ans": 0, "exp": "Le Conseil constitutionnel est composé de 9 membres nommés pour 9 ans, renouvelés par tiers tous les 3 ans."}, {"id": "c012", "cat": "Culture générale", "q": "Quelle institution française constitue la juridiction administrative suprême ?", "opts": ["Le Conseil d'État", "La Cour de cassation", "Le Conseil constitutionnel", "La Cour des comptes"], "ans": 0, "exp": "Le Conseil d'État est la plus haute juridiction administrative française, également conseiller juridique du gouvernement."}, {"id": "c013", "cat": "Culture générale", "q": "Quel est le mandat du Président de la République française ?", "opts": ["5 ans", "7 ans", "4 ans", "6 ans"], "ans": 0, "exp": "Depuis la réforme constitutionnelle de 2000, le mandat présidentiel est de 5 ans (quinquennat)."}, {"id": "c014", "cat": "Culture générale", "q": "Qu'est-ce que le Parlement français comprend ?", "opts": ["L'Assemblée nationale et le Sénat", "L'Assemblée nationale et le Conseil d'État", "Le Sénat et le Conseil constitutionnel", "L'Assemblée nationale, le Sénat et le Conseil économique"], "ans": 0, "exp": "Le Parlement français est bicaméral : il comprend l'Assemblée nationale (chambre basse) et le Sénat (chambre haute)."}, {"id": "c015", "cat": "Culture générale", "q": "Quelle est la principale mission de la Cour des comptes ?", "opts": ["Contrôler l'usage des deniers publics", "Juger les crimes les plus graves", "Examiner la constitutionnalité des lois", "Conseiller le gouvernement"], "ans": 0, "exp": "La Cour des comptes est une juridiction financière qui contrôle la régularité des comptes publics et évalue les politiques publiques."}, {"id": "c016", "cat": "Culture générale", "q": "Combien de régions métropolitaines compte la France depuis 2016 ?", "opts": ["13", "22", "18", "12"], "ans": 0, "exp": "Suite à la réforme territoriale de 2015 (loi NOTRe), la France métropolitaine compte 13 régions depuis le 1er janvier 2016."}, {"id": "c017", "cat": "Culture générale", "q": "Qu'est-ce que le principe de laïcité en France ?", "opts": ["La séparation des Églises et de l'État", "La liberté de culte uniquement", "L'athéisme d'État", "L'interdiction de toute religion"], "ans": 0, "exp": "La laïcité, inscrite dans la loi de 1905, garantit la séparation des Églises et de l'État et la liberté de conscience."}, {"id": "c018", "cat": "Culture générale", "q": "Quel article de la Constitution définit la France comme 'République indivisible, laïque, démocratique et sociale' ?", "opts": ["Article 1", "Article 2", "Article 3", "Article 5"], "ans": 0, "exp": "L'article 1er de la Constitution de 1958 définit la France comme une République indivisible, laïque, démocratique et sociale."}, {"id": "c019", "cat": "Culture générale", "q": "Quel est le rôle du Médiateur de la République (devenu le Défenseur des droits) ?", "opts": ["Défendre les droits des citoyens face aux administrations", "Médiatiser les conflits entre pays", "Superviser les médias publics", "Contrôler les dépenses de l'État"], "ans": 0, "exp": "Le Défenseur des droits (ex-Médiateur) protège les citoyens contre les dysfonctionnements des administrations et défend les droits fondamentaux."}, {"id": "c020", "cat": "Culture générale", "q": "Qu'est-ce qu'une ordonnance en droit constitutionnel français ?", "opts": ["Un acte du gouvernement pris en vertu d'une habilitation législative", "Un arrêté municipal", "Une décision du Conseil d'État", "Un texte adopté par référendum"], "ans": 0, "exp": "L'ordonnance (art. 38 de la Constitution) permet au gouvernement de légiférer dans des domaines relevant normalement de la loi, avec autorisation du Parlement."}, {"id": "c021", "cat": "Culture générale", "q": "Quel est le fleuve le plus long de France ?", "opts": ["La Loire", "Le Rhin", "La Seine", "Le Rhône"], "ans": 0, "exp": "La Loire, avec 1 013 km, est le plus long fleuve entièrement français."}, {"id": "c022", "cat": "Culture générale", "q": "Quel est le plus haut sommet de France et d'Europe occidentale ?", "opts": ["Le Mont-Blanc", "Le Mont-Rose", "Le Cervin", "La Meije"], "ans": 0, "exp": "Le Mont-Blanc culmine à 4 808 m. Il est situé à la frontière franco-italienne."}, {"id": "c023", "cat": "Culture générale", "q": "Quelle mer borde le Sud-Est de la France ?", "opts": ["La mer Méditerranée", "La mer du Nord", "La mer Celtique", "La mer Adriatique"], "ans": 0, "exp": "La côte méditerranéenne française (Provence, Languedoc, Côte d'Azur) borde la mer Méditerranée."}, {"id": "c024", "cat": "Culture générale", "q": "Quel est le département français le plus peuplé ?", "opts": ["Le Nord", "Les Bouches-du-Rhône", "Paris", "La Seine-Saint-Denis"], "ans": 0, "exp": "Le Nord (59) est le département métropolitain le plus peuplé avec environ 2,6 millions d'habitants."}, {"id": "c025", "cat": "Culture générale", "q": "Quelle est la superficie approximative de la France métropolitaine ?", "opts": ["551 000 km²", "450 000 km²", "640 000 km²", "500 000 km²"], "ans": 0, "exp": "La France métropolitaine couvre environ 551 695 km², ce qui en fait le plus grand pays d'Europe de l'Ouest."}, {"id": "c026", "cat": "Culture générale", "q": "Quel pays est la plus grande nation de l'Union européenne par sa superficie ?", "opts": ["La France", "L'Allemagne", "L'Espagne", "La Suède"], "ans": 0, "exp": "La France est le plus grand pays de l'Union européenne par sa superficie totale (y compris les territoires ultramarins)."}, {"id": "c027", "cat": "Culture générale", "q": "Quel océan borde la côte ouest de la France ?", "opts": ["L'océan Atlantique", "L'océan Pacifique", "L'océan Arctique", "L'océan Indien"], "ans": 0, "exp": "La façade atlantique française (de Brest à Bayonne) borde l'océan Atlantique."}, {"id": "c028", "cat": "Culture générale", "q": "Quelle ville française est surnommée 'la Cité des Papes' ?", "opts": ["Avignon", "Reims", "Lyon", "Tours"], "ans": 0, "exp": "Avignon fut le siège de la papauté de 1309 à 1377, d'où son surnom de 'Cité des Papes'."}, {"id": "c029", "cat": "Culture générale", "q": "Quel est le nom du tunnel sous la Manche qui relie la France au Royaume-Uni ?", "opts": ["L'Eurotunnel (ou Channel Tunnel)", "Le tunnel de la Manche", "Le Chunnel", "Le Franco-British Tunnel"], "ans": 0, "exp": "L'Eurotunnel (officiellement Channel Tunnel) relie Coquelles (Calais) à Folkestone depuis 1994."}, {"id": "c030", "cat": "Culture générale", "q": "Quelle est la capitale de la Nouvelle-Aquitaine ?", "opts": ["Bordeaux", "Poitiers", "Limoges", "Pau"], "ans": 0, "exp": "Bordeaux est le chef-lieu de la région Nouvelle-Aquitaine depuis la fusion des régions en 2016."}, {"id": "c031", "cat": "Culture générale", "q": "Quelle est la vitesse de la lumière dans le vide ?", "opts": ["300 000 km/s", "150 000 km/s", "1 000 000 km/s", "30 000 km/s"], "ans": 0, "exp": "La vitesse de la lumière dans le vide est d'environ 299 792 km/s, soit approximativement 300 000 km/s."}, {"id": "c032", "cat": "Culture générale", "q": "Qui a découvert la pénicilline ?", "opts": ["Alexander Fleming", "Louis Pasteur", "Marie Curie", "Robert Koch"], "ans": 0, "exp": "Alexander Fleming découvrit la pénicilline en 1928 en observant qu'une moisissure inhibait la croissance de bactéries."}, {"id": "c033", "cat": "Culture générale", "q": "Quel est le symbole chimique de l'or ?", "opts": ["Au", "Or", "Go", "Ag"], "ans": 0, "exp": "L'or a pour symbole 'Au', du latin 'aurum'."}, {"id": "c034", "cat": "Culture générale", "q": "Combien y a-t-il d'os dans le corps humain adulte ?", "opts": ["206", "212", "180", "250"], "ans": 0, "exp": "Le corps humain adulte compte environ 206 os. À la naissance, on en compte environ 270, certains se soudant avec la croissance."}, {"id": "c035", "cat": "Culture générale", "q": "Quelle planète est la plus grande du système solaire ?", "opts": ["Jupiter", "Saturne", "Neptune", "Uranus"], "ans": 0, "exp": "Jupiter est la plus grande planète du système solaire, avec un diamètre d'environ 143 000 km."}, {"id": "c036", "cat": "Culture générale", "q": "Quel est le principal gaz à effet de serre émis par les activités humaines ?", "opts": ["Le dioxyde de carbone (CO₂)", "Le méthane (CH₄)", "Le protoxyde d'azote (N₂O)", "L'ozone (O₃)"], "ans": 0, "exp": "Le CO₂ est le principal GES anthropique, représentant environ 76% des émissions totales."}, {"id": "c037", "cat": "Culture générale", "q": "Qui est l'inventeur du World Wide Web ?", "opts": ["Tim Berners-Lee", "Bill Gates", "Steve Jobs", "Vint Cerf"], "ans": 0, "exp": "Tim Berners-Lee inventa le World Wide Web au CERN en 1989, en proposant un système de partage d'information."}, {"id": "c038", "cat": "Culture générale", "q": "Quelle est la formule chimique de l'eau ?", "opts": ["H₂O", "HO₂", "H₂O₂", "OH"], "ans": 0, "exp": "L'eau est formée de deux atomes d'hydrogène et d'un atome d'oxygène : H₂O."}, {"id": "c039", "cat": "Culture générale", "q": "Quel phénomène décrit la théorie de la relativité d'Einstein ?", "opts": ["La relation entre masse et énergie (E=mc²)", "La gravitation universelle", "La mécanique quantique", "L'électromagnétisme"], "ans": 0, "exp": "La théorie de la relativité restreinte (1905) établit notamment que E=mc², reliant énergie et masse."}, {"id": "c040", "cat": "Culture générale", "q": "Quel est l'élément chimique le plus abondant dans l'atmosphère terrestre ?", "opts": ["L'azote (N₂)", "L'oxygène (O₂)", "L'argon (Ar)", "Le dioxyde de carbone"], "ans": 0, "exp": "L'azote représente environ 78% de l'atmosphère terrestre, contre 21% pour l'oxygène."}, {"id": "c041", "cat": "Culture générale", "q": "Quel auteur français a écrit 'Les Misérables' ?", "opts": ["Victor Hugo", "Émile Zola", "Gustave Flaubert", "Honoré de Balzac"], "ans": 0, "exp": "Victor Hugo publia 'Les Misérables' en 1862. Ce roman monumental est l'une des œuvres majeures de la littérature française."}, {"id": "c042", "cat": "Culture générale", "q": "Quel prix littéraire français est le plus prestigieux ?", "opts": ["Le Prix Goncourt", "Le Prix Renaudot", "Le Prix Médicis", "Le Prix Femina"], "ans": 0, "exp": "Le Prix Goncourt, décerné depuis 1903, est le prix littéraire français le plus célèbre et le plus convoité."}, {"id": "c043", "cat": "Culture générale", "q": "Qui a peint la 'Joconde' ?", "opts": ["Léonard de Vinci", "Michel-Ange", "Raphaël", "Botticelli"], "ans": 0, "exp": "La Joconde (vers 1503-1519) est une œuvre de Léonard de Vinci, conservée au musée du Louvre à Paris."}, {"id": "c044", "cat": "Culture générale", "q": "Quel compositeur allemand est l'auteur de la Symphonie n°9 ?", "opts": ["Ludwig van Beethoven", "Johann Sebastian Bach", "Wolfgang Amadeus Mozart", "Franz Schubert"], "ans": 0, "exp": "Beethoven composa sa 9e Symphonie (1824), célèbre pour son finale avec chœur sur l'Ode à la joie de Schiller."}, {"id": "c045", "cat": "Culture générale", "q": "Quel auteur a écrit 'À la recherche du temps perdu' ?", "opts": ["Marcel Proust", "André Gide", "Paul Valéry", "Anatole France"], "ans": 0, "exp": "Marcel Proust rédigea son chef-d'œuvre 'À la recherche du temps perdu' (7 volumes, 1913-1927)."}, {"id": "c046", "cat": "Culture générale", "q": "Quel mouvement littéraire du XIXe siècle cherche à représenter fidèlement la réalité sociale ?", "opts": ["Le réalisme", "Le romantisme", "Le symbolisme", "Le naturalisme"], "ans": 0, "exp": "Le réalisme (1850-1880) vise à dépeindre objectivement la réalité sociale. Le naturalisme en est une évolution plus radicale."}, {"id": "c047", "cat": "Culture générale", "q": "Qui a écrit 'L'Étranger' ?", "opts": ["Albert Camus", "Jean-Paul Sartre", "Simone de Beauvoir", "André Malraux"], "ans": 0, "exp": "Albert Camus publia 'L'Étranger' en 1942. Ce roman illustre le concept d'absurde cher à l'auteur."}, {"id": "c048", "cat": "Culture générale", "q": "Quel est le mythe fondateur de la ville de Rome selon la tradition latine ?", "opts": ["Romulus et Rémus", "Énée et Lavinie", "Hercule et Prométhée", "Jules César et Cléopâtre"], "ans": 0, "exp": "Selon la tradition, Rome fut fondée en 753 av. J.-C. par Romulus, qui tua son frère jumeau Rémus."}, {"id": "c049", "cat": "Culture générale", "q": "Qui est l'auteur du 'Pensées' philosophique ?", "opts": ["Blaise Pascal", "René Descartes", "Michel de Montaigne", "Voltaire"], "ans": 0, "exp": "Blaise Pascal rédigea ses 'Pensées', publiées posthumément en 1670, réflexions sur la religion et la condition humaine."}, {"id": "c050", "cat": "Culture générale", "q": "Quel mouvement artistique est associé à Claude Monet ?", "opts": ["L'impressionnisme", "Le cubisme", "Le surréalisme", "Le fauvisme"], "ans": 0, "exp": "Claude Monet est l'un des fondateurs de l'impressionnisme. Son tableau 'Impression, soleil levant' (1872) a donné son nom au mouvement."}, {"id": "c051", "cat": "Culture générale", "q": "Combien de pays composent l'Union européenne en 2024 ?", "opts": ["27", "28", "25", "30"], "ans": 0, "exp": "Depuis le Brexit (sortie du Royaume-Uni le 31 janvier 2020), l'UE compte 27 États membres."}, {"id": "c052", "cat": "Culture générale", "q": "En quelle année le traité de Maastricht a-t-il été signé ?", "opts": ["1992", "1985", "1999", "2004"], "ans": 0, "exp": "Le traité de Maastricht fut signé le 7 février 1992 et entra en vigueur le 1er novembre 1993, créant l'Union européenne."}, {"id": "c053", "cat": "Culture générale", "q": "Quelle est la monnaie unique européenne ?", "opts": ["L'euro", "Le franc européen", "L'écu", "Le florin"], "ans": 0, "exp": "L'euro, introduit le 1er janvier 1999 (pièces et billets en 2002), est la monnaie officielle de 20 des 27 États membres."}, {"id": "c054", "cat": "Culture générale", "q": "Où siège le Parlement européen ?", "opts": ["À Strasbourg et Bruxelles", "Uniquement à Bruxelles", "Uniquement à Strasbourg", "À Luxembourg"], "ans": 0, "exp": "Le Parlement européen a deux sièges : Strasbourg (sessions plénières officielles) et Bruxelles (commissions et sessions additionnelles)."}, {"id": "c055", "cat": "Culture générale", "q": "Quel est le rôle de la BCE (Banque centrale européenne) ?", "opts": ["Définir et mettre en œuvre la politique monétaire de la zone euro", "Financer les États membres", "Contrôler les banques commerciales", "Gérer le budget de l'UE"], "ans": 0, "exp": "La BCE, basée à Francfort, a pour mission principale de maintenir la stabilité des prix dans la zone euro."}, {"id": "c056", "cat": "Culture générale", "q": "Quel principe européen signifie que les décisions doivent être prises au niveau le plus proche des citoyens ?", "opts": ["La subsidiarité", "La proportionnalité", "La solidarité", "La réciprocité"], "ans": 0, "exp": "Le principe de subsidiarité garantit que l'UE n'intervient que si les objectifs ne peuvent être mieux atteints par les États membres."}, {"id": "c057", "cat": "Culture générale", "q": "Quelle institution européenne a le pouvoir législatif partagé avec le Parlement européen ?", "opts": ["Le Conseil de l'Union européenne", "La Commission européenne", "La Cour de justice de l'UE", "Le Conseil européen"], "ans": 0, "exp": "Le Conseil de l'UE (ou Conseil des ministres), réunissant les ministres des États membres, exerce le pouvoir législatif conjointement avec le Parlement."}, {"id": "c058", "cat": "Culture générale", "q": "Que signifie l'acronyme 'TFUE' ?", "opts": ["Traité sur le fonctionnement de l'Union européenne", "Traité franco-européen", "Taxe fiscale unique européenne", "Transfert financier de l'Union européenne"], "ans": 0, "exp": "Le TFUE (Traité sur le fonctionnement de l'UE) est l'un des deux traités fondateurs de l'UE, issu du Traité de Lisbonne (2007)."}, {"id": "c059", "cat": "Culture générale", "q": "Quel programme européen favorise la mobilité étudiante entre pays membres ?", "opts": ["Erasmus+", "Horizon Europe", "Cohesion Fund", "LIFE"], "ans": 0, "exp": "Erasmus+ est le programme phare de l'UE pour l'éducation, la formation, la jeunesse et le sport, permettant la mobilité internationale."}, {"id": "c060", "cat": "Culture générale", "q": "Quelle est la principale mission de la Cour de justice de l'Union européenne ?", "opts": ["Assurer le respect du droit de l'UE", "Juger les violations des droits de l'homme", "Contrôler les budgets nationaux", "Arbitrer les conflits commerciaux"], "ans": 0, "exp": "La CJUE, siégeant à Luxembourg, veille à l'interprétation et à l'application uniformes du droit de l'UE."}, {"id": "c061", "cat": "Culture générale", "q": "Que signifie le PIB ?", "opts": ["Produit intérieur brut", "Profit industriel brut", "Production intégrale de biens", "Projet d'investissement budgétaire"], "ans": 0, "exp": "Le PIB mesure la valeur totale des biens et services produits sur un territoire national durant une période donnée."}, {"id": "c062", "cat": "Culture générale", "q": "Qu'est-ce que l'inflation ?", "opts": ["La hausse générale et durable des prix", "La baisse du niveau de vie", "L'augmentation du chômage", "La réduction de la masse monétaire"], "ans": 0, "exp": "L'inflation désigne la hausse générale et continue du niveau des prix, qui réduit le pouvoir d'achat de la monnaie."}, {"id": "c063", "cat": "Culture générale", "q": "Quel organisme international régule le commerce mondial ?", "opts": ["L'OMC", "Le FMI", "La Banque mondiale", "L'OCDE"], "ans": 0, "exp": "L'Organisation mondiale du commerce (OMC), créée en 1995, régule les règles du commerce international entre nations."}, {"id": "c064", "cat": "Culture générale", "q": "Qu'est-ce que le déficit budgétaire ?", "opts": ["Quand les dépenses de l'État dépassent ses recettes", "Quand les recettes dépassent les dépenses", "Quand la dette publique augmente", "Quand le commerce extérieur est négatif"], "ans": 0, "exp": "Un déficit budgétaire survient lorsque les dépenses publiques excèdent les recettes fiscales et autres sur une année."}, {"id": "c065", "cat": "Culture générale", "q": "Quelle institution internationale a été créée en 1944 pour assurer la stabilité financière mondiale ?", "opts": ["Le FMI", "L'ONU", "L'OMC", "La Banque mondiale"], "ans": 0, "exp": "Le Fonds monétaire international (FMI) fut créé lors des accords de Bretton Woods en 1944 pour stabiliser le système monétaire international."}, {"id": "c066", "cat": "Culture générale", "q": "Qu'est-ce que la TVA ?", "opts": ["Une taxe sur la valeur ajoutée collectée à chaque étape de production", "Un impôt sur le revenu des entreprises", "Une cotisation sociale", "Un droit de douane"], "ans": 0, "exp": "La TVA (Taxe sur la valeur ajoutée) est un impôt indirect collecté à chaque stade de la chaîne de production et de distribution."}, {"id": "c067", "cat": "Culture générale", "q": "Quel concept économique désigne la situation où l'offre et la demande s'égalisent ?", "opts": ["L'équilibre de marché", "La concurrence parfaite", "L'optimum de Pareto", "Le monopole"], "ans": 0, "exp": "L'équilibre de marché est atteint quand la quantité offerte égale la quantité demandée, déterminant le prix d'équilibre."}, {"id": "c068", "cat": "Culture générale", "q": "Qu'est-ce que le taux de chômage mesure ?", "opts": ["La part de la population active sans emploi et en cherchant un", "Le pourcentage de personnes sans revenu", "Le nombre de sans-abri", "La part de personnes inactives"], "ans": 0, "exp": "Le taux de chômage mesure la proportion de chômeurs (personnes sans emploi, disponibles et en recherche active) parmi la population active."}, {"id": "c069", "cat": "Culture générale", "q": "Quel est le principe économique de la 'main invisible' ?", "opts": ["Le marché s'autorégule par la confrontation de l'offre et de la demande", "L'État doit contrôler tous les échanges", "Les inégalités sont bénéfiques à la croissance", "Les entreprises doivent coopérer"], "ans": 0, "exp": "Adam Smith (1776) théorisa que chaque individu, en poursuivant son intérêt personnel, contribue à l'efficacité collective via le marché."}, {"id": "c070", "cat": "Culture générale", "q": "Que mesure l'Indice des prix à la consommation (IPC) ?", "opts": ["L'évolution des prix d'un panier de biens et services représentatif", "Le coût de la vie des ménages les plus pauvres", "Le prix moyen du logement", "L'inflation uniquement dans l'industrie"], "ans": 0, "exp": "L'IPC suit l'évolution des prix d'un panier de biens et services consommés par les ménages, servant à mesurer l'inflation."}, {"id": "c071", "cat": "Culture générale", "q": "Quelle est la mission principale des douanes françaises ?", "opts": ["Contrôler les flux de marchandises aux frontières et percevoir les droits", "Surveiller les frontières terrestres uniquement", "Contrôler les passeports des voyageurs", "Gérer les impôts locaux"], "ans": 0, "exp": "La douane française (DGDDI) contrôle les marchandises aux frontières, perçoit les droits et taxes, et lutte contre la fraude."}, {"id": "c072", "cat": "Culture générale", "q": "Qu'est-ce qu'un droit de douane ?", "opts": ["Une taxe prélevée sur les marchandises importées ou exportées", "Un droit de passage sur les autoroutes", "Un impôt sur les sociétés étrangères", "Une redevance portuaire"], "ans": 0, "exp": "Un droit de douane est une taxe imposée par un État sur les marchandises qui franchissent ses frontières douanières."}, {"id": "c073", "cat": "Culture générale", "q": "Que signifie l'acronyme DGDDI ?", "opts": ["Direction générale des douanes et droits indirects", "Direction générale du droit de douane et des impôts", "Direction générale des données douanières internationales", "Département général de la douane et des dépôts internationaux"], "ans": 0, "exp": "La DGDDI (Direction générale des douanes et droits indirects) est le service de l'État chargé des missions douanières en France."}, {"id": "c074", "cat": "Culture générale", "q": "Qu'est-ce que le dédouanement ?", "opts": ["La procédure administrative permettant de mettre des marchandises en libre pratique", "Le paiement des droits de douane uniquement", "Le contrôle physique des marchandises", "L'enregistrement des navires"], "ans": 0, "exp": "Le dédouanement est l'ensemble des formalités permettant à des marchandises de franchir légalement une frontière douanière."}, {"id": "c075", "cat": "Culture générale", "q": "Qu'est-ce que la valeur en douane d'une marchandise ?", "opts": ["La base de calcul des droits et taxes, généralement la valeur transactionnelle", "Le prix de revient de la marchandise", "La valeur assurée de la marchandise", "Le prix de vente au détail"], "ans": 0, "exp": "La valeur en douane est la valeur sur laquelle sont calculés les droits de douane ; elle est généralement égale au prix effectivement payé (valeur transactionnelle)."}, {"id": "c076", "cat": "Culture générale", "q": "Quelle est la différence entre une loi et un décret ?", "opts": ["La loi est votée par le Parlement, le décret est pris par le gouvernement", "La loi est adoptée par le gouvernement, le décret par le Parlement", "La loi s'applique à tous, le décret seulement aux fonctionnaires", "Il n'y a pas de différence pratique"], "ans": 0, "exp": "La loi est adoptée par le Parlement (art. 34 de la Constitution) ; le décret est un acte réglementaire du gouvernement (art. 37)."}, {"id": "c077", "cat": "Culture générale", "q": "Qu'est-ce que la présomption d'innocence ?", "opts": ["Tout accusé est considéré innocent jusqu'à preuve du contraire", "L'accusé doit prouver son innocence", "Le procureur est présumé avoir raison", "Le juge décide avant le procès"], "ans": 0, "exp": "La présomption d'innocence est un principe fondamental : toute personne accusée est présumée innocente jusqu'à ce que sa culpabilité soit prouvée."}, {"id": "c078", "cat": "Culture générale", "q": "Qu'est-ce que la séparation des pouvoirs ?", "opts": ["La distinction entre pouvoir législatif, exécutif et judiciaire", "La division du territoire en régions autonomes", "La répartition des compétences entre État et collectivités", "Le partage du budget entre ministères"], "ans": 0, "exp": "Théorisée par Montesquieu, la séparation des pouvoirs distingue le législatif (loi), l'exécutif (application) et le judiciaire (justice)."}, {"id": "c079", "cat": "Culture générale", "q": "Qu'est-ce que la démocratie représentative ?", "opts": ["Un système où les citoyens élisent des représentants pour gouverner", "Un système où tous les citoyens votent directement sur chaque loi", "Un régime où le roi est élu", "Un gouvernement par tirage au sort"], "ans": 0, "exp": "Dans une démocratie représentative, les citoyens délèguent leur pouvoir à des élus qui prennent les décisions en leur nom."}, {"id": "c080", "cat": "Culture générale", "q": "Que signifie 'État de droit' ?", "opts": ["Un État soumis à des règles juridiques supérieures s'appliquant à tous", "Un État gouverné par des juristes", "Un État qui applique seulement les lois nationales", "Un État sans Constitution"], "ans": 0, "exp": "L'État de droit désigne un système où l'État lui-même est soumis au droit ; toutes les autorités publiques respectent des normes juridiques supérieures."}, {"id": "c081", "cat": "Culture générale", "q": "Qu'est-ce que le développement durable ?", "opts": ["Un développement répondant aux besoins présents sans compromettre ceux des générations futures", "Une croissance économique rapide", "Un développement purement environnemental", "La préservation de la nature sans activité économique"], "ans": 0, "exp": "Définition du rapport Brundtland (1987) : le développement durable satisfait les besoins actuels sans compromettre la capacité des générations futures."}, {"id": "c082", "cat": "Culture générale", "q": "Qu'est-ce que le G7 ?", "opts": ["Un groupe des 7 pays les plus industrialisés", "Les 7 pays membres permanents de l'ONU", "Un groupe de 7 banques centrales", "Les 7 pays fondateurs de l'UE"], "ans": 0, "exp": "Le G7 rassemble les 7 principales économies mondiales : États-Unis, Canada, Japon, Allemagne, France, Italie et Royaume-Uni."}, {"id": "c083", "cat": "Culture générale", "q": "Quelle organisation internationale a été créée en 1945 pour maintenir la paix mondiale ?", "opts": ["L'ONU", "L'OTAN", "L'UNESCO", "L'OMC"], "ans": 0, "exp": "L'Organisation des Nations Unies (ONU) fut fondée le 24 octobre 1945 avec pour mission principale le maintien de la paix et de la sécurité internationale."}, {"id": "c084", "cat": "Culture générale", "q": "Qu'est-ce que le réchauffement climatique ?", "opts": ["L'augmentation de la température moyenne de la Terre due aux activités humaines", "Une variation naturelle du climat", "L'effet des volcans sur l'atmosphère", "Le phénomène d'El Niño"], "ans": 0, "exp": "Le réchauffement climatique actuel est principalement causé par l'augmentation des gaz à effet de serre liée aux activités humaines depuis la révolution industrielle."}, {"id": "c085", "cat": "Culture générale", "q": "Que signifie 'IA' dans le contexte technologique ?", "opts": ["Intelligence artificielle", "Information automatisée", "Infrastructure avancée", "Interface analogique"], "ans": 0, "exp": "L'Intelligence Artificielle (IA) désigne l'ensemble des techniques permettant à des machines de simuler des formes d'intelligence humaine."}, {"id": "c086", "cat": "Culture générale", "q": "Qu'est-ce que le RGPD ?", "opts": ["Le Règlement général sur la protection des données", "Le Règlement de gestion des projets de développement", "Le Registre général des personnes dépendantes", "Le Regroupement général de la politique douanière"], "ans": 0, "exp": "Le RGPD (Règlement général sur la protection des données) est le règlement européen qui encadre le traitement des données personnelles depuis mai 2018."}, {"id": "c087", "cat": "Culture générale", "q": "Quel accord international vise à limiter le réchauffement climatique à 1,5°C ?", "opts": ["L'Accord de Paris", "Le Protocole de Kyoto", "La Convention de Rio", "L'Agenda 2030"], "ans": 0, "exp": "L'Accord de Paris, signé en 2015 lors de la COP21, engage les signataires à limiter la hausse des températures à 1,5°C ou 2°C par rapport à l'ère préindustrielle."}, {"id": "c088", "cat": "Culture générale", "q": "Qu'est-ce que la blockchain ?", "opts": ["Une technologie de registre distribué et décentralisé", "Un type de réseau social", "Un langage de programmation", "Un protocole de sécurité internet"], "ans": 0, "exp": "La blockchain est une base de données distribuée et partagée qui enregistre les transactions de façon immuable et transparente."}, {"id": "c089", "cat": "Culture générale", "q": "Quel est le principal objectif des Accords de Schengen ?", "opts": ["Supprimer les contrôles aux frontières intérieures entre pays membres", "Créer une monnaie unique européenne", "Harmoniser les politiques fiscales", "Établir une armée européenne commune"], "ans": 0, "exp": "Les Accords de Schengen (1985) ont supprimé les contrôles aux frontières intérieures entre les États membres de l'espace Schengen (26 pays actuellement)."}, {"id": "c090", "cat": "Culture générale", "q": "Quelle est la principale cause de la montée des eaux océaniques ?", "opts": ["La fonte des glaces polaires et la dilatation thermique de l'eau", "Les tremblements de terre sous-marins", "L'extraction de pétrole offshore", "La pollution marine"], "ans": 0, "exp": "La montée du niveau des mers résulte principalement de la dilatation thermique des océans (réchauffement) et de la fonte des glaces continentales."}, {"id": "c091", "cat": "Culture générale", "q": "Qu'est-ce que la sociologie ?", "opts": ["L'étude scientifique des sociétés humaines et des faits sociaux", "L'étude du comportement individuel", "La science des systèmes politiques", "L'étude des marchés économiques"], "ans": 0, "exp": "La sociologie, fondée par Auguste Comte et développée par Émile Durkheim, étudie les structures, groupes et faits sociaux."}, {"id": "c092", "cat": "Culture générale", "q": "Qui est l'auteur du 'Contrat social' ?", "opts": ["Jean-Jacques Rousseau", "Voltaire", "Montesquieu", "John Locke"], "ans": 0, "exp": "Jean-Jacques Rousseau publia 'Du Contrat social' en 1762, théorisant la légitimité du pouvoir politique basée sur la volonté générale."}, {"id": "c093", "cat": "Culture générale", "q": "Qu'est-ce que le service public en France ?", "opts": ["Une activité d'intérêt général assurée ou réglementée par une personne publique", "Un emploi dans l'administration", "Un service gratuit pour tous", "Un monopole de l'État"], "ans": 0, "exp": "Le service public désigne toute activité d'intérêt général dont une personne publique assure ou réglemente l'exécution pour satisfaire les besoins de la collectivité."}, {"id": "c094", "cat": "Culture générale", "q": "Qu'est-ce que le principe d'égalité dans le service public ?", "opts": ["Tous les usagers doivent être traités de la même façon", "Tous les agents ont le même salaire", "L'État doit traiter tous les États étrangers pareillement", "Tous les citoyens payent les mêmes impôts"], "ans": 0, "exp": "Le principe d'égalité (l'une des trois lois de Rolland) impose de traiter les usagers dans des situations identiques de manière identique."}, {"id": "c095", "cat": "Culture générale", "q": "Qu'est-ce que la décentralisation ?", "opts": ["Le transfert de compétences de l'État vers les collectivités territoriales", "Le déplacement des administrations en province", "La suppression des préfets", "La privatisation des services publics"], "ans": 0, "exp": "La décentralisation transfère des compétences et ressources de l'État vers les collectivités territoriales (communes, départements, régions) dotées d'une personnalité juridique propre."}, {"id": "c096", "cat": "Culture générale", "q": "Quelle est la date de la fête nationale française ?", "opts": ["14 juillet", "8 mai", "11 novembre", "1er mai"], "ans": 0, "exp": "Le 14 juillet commémore la prise de la Bastille (1789) et la Fête de la Fédération (1790). C'est la fête nationale depuis 1880."}, {"id": "c097", "cat": "Culture générale", "q": "Quel est l'hymne national français ?", "opts": ["La Marseillaise", "La Brabançonne", "God Save the King", "La Marche consulaire"], "ans": 0, "exp": "La Marseillaise, composée par Rouget de Lisle en 1792, est l'hymne national français depuis 1879."}, {"id": "c098", "cat": "Culture générale", "q": "Quelle devise figure sur les monuments de la République française ?", "opts": ["Liberté, Égalité, Fraternité", "Travail, Famille, Patrie", "Honneur et Patrie", "Ordre et Progrès"], "ans": 0, "exp": "'Liberté, Égalité, Fraternité' est la devise de la République française, issue de la Révolution de 1789."}, {"id": "c099", "cat": "Culture générale", "q": "Quelle est la couleur du drapeau français ?", "opts": ["Bleu, blanc, rouge", "Rouge, blanc, bleu", "Bleu, rouge, blanc", "Blanc, bleu, rouge"], "ans": 0, "exp": "Le drapeau tricolore français est bleu (côté hampe), blanc (centre) et rouge (côté libre), adopté définitivement en 1794."}, {"id": "c100", "cat": "Culture générale", "q": "Quel est le symbole de la République française ?", "opts": ["Marianne", "La Tour Eiffel", "Le coq gaulois", "Le sceau de la République"], "ans": 0, "exp": "Marianne est le symbole officiel de la République française, présente notamment sur les documents officiels et les mairies."}, {"id": "c101", "cat": "Culture générale", "q": "Quelle est la langue officielle de la France selon la Constitution ?", "opts": ["Le français", "Le français et les langues régionales", "Il n'y a pas de langue officielle", "Le français et l'anglais"], "ans": 0, "exp": "L'article 2 de la Constitution dispose que 'la langue de la République est le français'."}, {"id": "c102", "cat": "Culture générale", "q": "Quel est le plus vieux monument de Paris encore debout ?", "opts": ["L'Obélisque de Louxor", "Notre-Dame de Paris", "Le Panthéon", "La Sainte-Chapelle"], "ans": 0, "exp": "L'Obélisque de Louxor, place de la Concorde, date d'environ 3 300 ans. Il fut offert à la France par l'Égypte en 1830."}, {"id": "c103", "cat": "Culture générale", "q": "Quel artiste français est connu pour ses bandes dessinées 'Astérix' ?", "opts": ["René Goscinny et Albert Uderzo", "Hergé", "Franquin", "Jean Giraud (Moebius)"], "ans": 0, "exp": "René Goscinny (scénario) et Albert Uderzo (dessins) ont créé Astérix en 1959 dans le magazine Pilote."}, {"id": "c104", "cat": "Culture générale", "q": "Quelle est la capitale de l'Allemagne ?", "opts": ["Berlin", "Munich", "Francfort", "Hambourg"], "ans": 0, "exp": "Berlin est la capitale et la plus grande ville d'Allemagne depuis la réunification en 1990."}, {"id": "c105", "cat": "Culture générale", "q": "Quel est le parlement du Royaume-Uni ?", "opts": ["Westminster", "Le Parlement européen", "Le Congrès", "Le Bundestag"], "ans": 0, "exp": "Le Parlement de Westminster, à Londres, est le parlement bicaméral du Royaume-Uni, composé de la Chambre des communes et de la Chambre des lords."}, {"id": "c106", "cat": "Culture générale", "q": "En quelle année le mur de Berlin est-il tombé ?", "opts": ["1989", "1991", "1987", "1993"], "ans": 0, "exp": "Le mur de Berlin est tombé le 9 novembre 1989, marquant la fin de la Guerre froide et ouvrant la voie à la réunification allemande (1990)."}, {"id": "c107", "cat": "Culture générale", "q": "Quel est le siège de l'ONU ?", "opts": ["New York", "Genève", "Vienne", "Bruxelles"], "ans": 0, "exp": "Le siège principal de l'ONU est à New York depuis 1952. Genève accueille l'Office des Nations Unies (ONUG)."}, {"id": "c108", "cat": "Culture générale", "q": "Quelle est la population mondiale approximative en 2024 ?", "opts": ["8 milliards", "7 milliards", "9 milliards", "6 milliards"], "ans": 0, "exp": "La population mondiale a franchi le cap des 8 milliards d'habitants en novembre 2022 et continue de croître."}, {"id": "c109", "cat": "Culture générale", "q": "Quel est le pays le plus peuplé du monde ?", "opts": ["L'Inde", "La Chine", "Les États-Unis", "Le Nigeria"], "ans": 0, "exp": "L'Inde a dépassé la Chine en 2023 pour devenir le pays le plus peuplé du monde, avec plus de 1,4 milliard d'habitants."}, {"id": "c110", "cat": "Culture générale", "q": "Quel est le continent le plus vaste du monde ?", "opts": ["L'Asie", "L'Afrique", "L'Amérique", "L'Antarctique"], "ans": 0, "exp": "L'Asie est le continent le plus étendu avec environ 44 millions de km², soit environ 30% des terres émergées."}, {"id": "c111", "cat": "Culture générale", "q": "Qu'est-ce qu'un traité international ?", "opts": ["Un accord formel entre États souverains créant des obligations juridiques", "Une recommandation non contraignante entre pays", "Un échange commercial entre nations", "Une résolution de l'ONU"], "ans": 0, "exp": "Un traité est un accord formel conclu entre sujets de droit international (États, organisations), créant des droits et obligations juridiquement contraignants."}, {"id": "c112", "cat": "Culture générale", "q": "Quel est le rôle de Frontex ?", "opts": ["L'agence européenne de garde-frontières et de garde-côtes", "L'agence douanière de l'UE", "Le service de contrôle des visas", "L'armée européenne"], "ans": 0, "exp": "Frontex coordonne la gestion des frontières extérieures de l'UE et soutient les États membres dans leurs missions de garde-frontières."}, {"id": "c113", "cat": "Culture générale", "q": "Qu'est-ce que la politique agricole commune (PAC) de l'UE ?", "opts": ["Une politique de soutien et de régulation du secteur agricole européen", "Un accord de libre-échange agricole mondial", "Une politique de protection des forêts", "Un programme alimentaire mondial"], "ans": 0, "exp": "La PAC, mise en place depuis 1962, vise à garantir la sécurité alimentaire, soutenir les agriculteurs et protéger l'environnement rural européen."}, {"id": "c114", "cat": "Culture générale", "q": "Qu'est-ce que le droit de veto au Conseil de sécurité de l'ONU ?", "opts": ["Le pouvoir des 5 membres permanents de bloquer toute résolution", "Le droit de s'abstenir lors d'un vote", "Le droit d'exclusion d'un État membre", "Le droit de proposer des résolutions"], "ans": 0, "exp": "Les 5 membres permanents (États-Unis, Russie, Chine, France, Royaume-Uni) peuvent bloquer toute résolution par leur vote négatif."}, {"id": "c115", "cat": "Culture générale", "q": "Quelle est la définition d'une ONG ?", "opts": ["Une organisation non gouvernementale à but non lucratif", "Une organisation nationale de gouvernance", "Une entreprise multinationale privée", "Un organe des Nations Unies"], "ans": 0, "exp": "Une ONG (Organisation non gouvernementale) est une association privée à but non lucratif, indépendante des gouvernements, agissant dans l'intérêt général."}, {"id": "c116", "cat": "Culture générale", "q": "Qu'est-ce que la souveraineté nationale ?", "opts": ["Le pouvoir suprême d'un État qui ne reconnaît aucune autorité supérieure", "Le contrôle de l'État sur son économie", "Le droit des peuples à l'autodétermination", "La domination d'un État sur d'autres"], "ans": 0, "exp": "La souveraineté nationale signifie que l'État exerce un pouvoir suprême sur son territoire sans être soumis à une autorité extérieure supérieure."}, {"id": "c117", "cat": "Culture générale", "q": "Quel est le rôle du Haut-Commissariat des Nations Unies pour les réfugiés (UNHCR) ?", "opts": ["Protéger et assister les réfugiés dans le monde entier", "Gérer les migrations économiques", "Contrôler les visas internationaux", "Lutter contre la traite des êtres humains"], "ans": 0, "exp": "L'UNHCR protège les droits et le bien-être des réfugiés et des personnes déplacées de force, en assurant leur assistance et leur réintégration."}, {"id": "c118", "cat": "Culture générale", "q": "Que signifie 'droit d'asile' ?", "opts": ["La protection accordée par un État à une personne persécutée dans son pays d'origine", "Le droit de circuler librement", "Le droit à un logement social", "L'immunité diplomatique"], "ans": 0, "exp": "Le droit d'asile protège les personnes persécutées pour leurs opinions, religion, nationalité ou appartenance à un groupe social contre le renvoi dans leur pays."}, {"id": "c119", "cat": "Culture générale", "q": "Quel est le principe de réciprocité en droit international ?", "opts": ["Les États se traitent mutuellement comme ils sont traités par l'autre", "Chaque État agit indépendamment", "Les plus forts imposent leurs règles", "Les petits États ont plus de droits"], "ans": 0, "exp": "La réciprocité implique que les droits et obligations entre États sont mutuels : chaque État accorde à l'autre ce que celui-ci lui accorde."}, {"id": "c120", "cat": "Culture générale", "q": "Qu'est-ce que la mondialisation ?", "opts": ["L'intégration économique, culturelle et politique croissante des pays", "L'uniformisation des cultures", "La domination économique américaine", "La disparition des frontières"], "ans": 0, "exp": "La mondialisation désigne le processus d'intégration et d'interdépendance croissante des économies, des cultures et des politiques à l'échelle planétaire."}, {"id": "c121", "cat": "Culture générale", "q": "Quelle est la mission de l'UNESCO ?", "opts": ["Promouvoir la paix par l'éducation, la science et la culture", "Gérer l'aide alimentaire mondiale", "Financer les projets de développement", "Superviser les élections internationales"], "ans": 0, "exp": "L'UNESCO (Organisation des Nations Unies pour l'éducation, la science et la culture) œuvre pour la paix et le développement par la coopération internationale."}, {"id": "c122", "cat": "Culture générale", "q": "Qu'est-ce que le Conseil de l'Europe (à ne pas confondre avec le Conseil européen) ?", "opts": ["Une organisation internationale de défense des droits de l'homme, distinct de l'UE", "Le sommet des chefs d'État de l'UE", "Une institution de l'Union européenne", "Un conseil consultatif européen"], "ans": 0, "exp": "Le Conseil de l'Europe (47 membres, dont non-membres de l'UE) est une organisation internationale dédiée aux droits de l'homme. Il a créé la CEDH."}, {"id": "c123", "cat": "Culture générale", "q": "Quelle est la Cour européenne des droits de l'homme ?", "opts": ["Une juridiction du Conseil de l'Europe qui protège les droits fondamentaux", "La cour suprême de l'Union européenne", "Le tribunal pénal international", "La cour arbitrale commerciale de l'Europe"], "ans": 0, "exp": "La CEDH (siège à Strasbourg) examine les recours de particuliers contre des États membres du Conseil de l'Europe pour violations de la Convention européenne des droits de l'homme."}, {"id": "c124", "cat": "Culture générale", "q": "Qu'est-ce que la coopération décentralisée ?", "opts": ["La coopération internationale entre collectivités territoriales", "La coopération entre administrations locales d'un même pays", "Un accord entre l'État et les régions", "Un mécanisme de financement régional"], "ans": 0, "exp": "La coopération décentralisée désigne les relations partenariales entre collectivités territoriales de différents pays, distinctes de la coopération interétatique classique."}, {"id": "c125", "cat": "Culture générale", "q": "Quel est l'objectif principal du Programme des Nations Unies pour le développement (PNUD) ?", "opts": ["Éliminer la pauvreté et réduire les inégalités dans le monde", "Financer les guerres d'indépendance", "Superviser le commerce international", "Protéger l'environnement marin"], "ans": 0, "exp": "Le PNUD œuvre dans 170 pays pour éradiquer la pauvreté, réduire les inégalités et promouvoir le développement durable."}, {"id": "c126", "cat": "Culture générale", "q": "Quelle est la principale caractéristique d'un État fédéral ?", "opts": ["La répartition du pouvoir entre un gouvernement central et des entités fédérées autonomes", "La concentration du pouvoir en un seul centre", "L'absence de Constitution écrite", "La domination de l'exécutif sur le législatif"], "ans": 0, "exp": "Dans un État fédéral (États-Unis, Allemagne, Suisse), des entités fédérées (États, Länder, cantons) disposent d'une autonomie constitutionnelle propre."}, {"id": "c127", "cat": "Culture générale", "q": "Qu'est-ce que le Protocole de Montréal (1987) ?", "opts": ["Un traité international pour la protection de la couche d'ozone", "Un accord sur la réduction des gaz à effet de serre", "Un traité sur la réduction des armes nucléaires", "Un accord sur la préservation de la biodiversité"], "ans": 0, "exp": "Le Protocole de Montréal vise l'élimination progressive des substances qui appauvrissent la couche d'ozone (CFC, HCFC, etc.)."}, {"id": "c128", "cat": "Culture générale", "q": "Qu'est-ce que le commerce équitable ?", "opts": ["Un échange garantissant des conditions commerciales plus justes aux producteurs des pays en développement", "Un échange sans droits de douane", "Un accord de libre-échange entre pays du Sud", "Un commerce supervisé par l'ONU"], "ans": 0, "exp": "Le commerce équitable vise à assurer des prix et conditions de travail décents aux producteurs des pays en développement, souvent au détriment du seul profit."}, {"id": "c129", "cat": "Culture générale", "q": "Quel est le rôle d'Interpol ?", "opts": ["Faciliter la coopération policière internationale", "Juger les criminels internationaux", "Contrôler les frontières européennes", "Gérer les bases de données criminelles de l'ONU"], "ans": 0, "exp": "Interpol (Organisation internationale de police criminelle) facilite la coopération entre les polices de 195 pays membres pour lutter contre la criminalité transnationale."}, {"id": "c130", "cat": "Culture générale", "q": "Qu'est-ce que la Convention des Nations Unies sur le droit de la mer (CNUDM) ?", "opts": ["Le traité international régissant l'utilisation des océans et de leurs ressources", "Un accord sur la pêche industrielle", "Un traité sur la protection des fonds marins", "Un accord sur les eaux territoriales uniquement"], "ans": 0, "exp": "La CNUDM (1982, entrée en vigueur 1994) fixe les droits et obligations des États concernant les espaces maritimes (eaux territoriales, ZEE, haute mer)."}, {"id": "c131", "cat": "Culture générale", "q": "Quelle est la définition du terrorisme selon le droit français ?", "opts": ["Des infractions commises intentionnellement en lien avec une entreprise individuelle ou collective visant à troubler gravement l'ordre public par l'intimidation", "Tout acte de violence", "Un acte de guerre", "Un crime organisé de grande envergure"], "ans": 0, "exp": "L'article 421-1 du Code pénal français définit le terrorisme comme des infractions intentionnelles liées à une entreprise visant à troubler l'ordre public par la terreur."}, {"id": "c132", "cat": "Culture générale", "q": "Qu'est-ce que la fraude fiscale ?", "opts": ["La soustraction illégale à l'obligation de payer ses impôts", "Le fait de demander des remboursements d'impôts", "L'optimisation fiscale légale", "Le paiement en retard des impôts"], "ans": 0, "exp": "La fraude fiscale est une infraction consistant à se soustraire illégalement à ses obligations fiscales (dissimulation de revenus, fausses déductions, etc.)."}, {"id": "c133", "cat": "Culture générale", "q": "Qu'est-ce que le blanchiment d'argent ?", "opts": ["Le processus visant à dissimuler l'origine illicite de fonds", "Le transfert d'argent entre pays", "L'évasion fiscale légale", "Le financement d'entreprises légales par des particuliers"], "ans": 0, "exp": "Le blanchiment consiste à introduire dans l'économie légale des fonds d'origine criminelle, en leur donnant une apparence licite."}, {"id": "c134", "cat": "Culture générale", "q": "Que signifie 'zone franche' ?", "opts": ["Une zone géographique où les marchandises sont exemptes de droits de douane", "Une zone sans contrôle d'identité", "Un espace de libre circulation des personnes", "Une zone économique exclusive en mer"], "ans": 0, "exp": "Une zone franche est un territoire délimité où les marchandises peuvent être importées, stockées et transformées sans payer de droits de douane."}, {"id": "c135", "cat": "Culture générale", "q": "Quel est le rôle d'Europol ?", "opts": ["L'agence européenne chargée de la coopération policière et du renseignement criminel", "La police aux frontières de l'UE", "Le parquet européen", "L'agence de formation des polices nationales"], "ans": 0, "exp": "Europol (siège à La Haye) soutient la coopération policière entre les États membres de l'UE dans la lutte contre la criminalité organisée et le terrorisme."}, {"id": "c136", "cat": "Culture générale", "q": "Qu'est-ce que l'état d'urgence en France ?", "opts": ["Un régime exceptionnel accordant des pouvoirs élargis aux autorités pour faire face à une crise grave", "La dissolution
