de l'Assemblée nationale", "La mise en place d'un couvre-feu systématique", "La suspension de la Constitution"], "ans": 0, "exp": "L'état d'urgence (loi de 1955) permet aux autorités civiles de restreindre certaines libertés publiques pour faire face à des troubles graves ou des calamités."}, {"id": "c137", "cat": "Culture générale", "q": "Qu'est-ce que le principe de proportionnalité en droit ?", "opts": ["Les mesures prises doivent être proportionnées aux objectifs visés", "L'égalité des peines", "Le partage égal des responsabilités", "La proportionnalité des impôts selon les revenus"], "ans": 0, "exp": "Le principe de proportionnalité exige que les mesures adoptées (notamment par les autorités) soient adaptées et nécessaires par rapport aux objectifs poursuivis."}, {"id": "c138", "cat": "Culture générale", "q": "Quelle est la différence entre un crime et un délit ?", "opts": ["Le crime est la plus grave des infractions, jugé aux assises ; le délit est moins grave, jugé au correctionnel", "Un crime est commis avec préméditation, un délit non", "Un crime implique toujours des victimes physiques", "Il n'y a aucune différence juridique"], "ans": 0, "exp": "En droit français, les infractions sont classées par gravité : contraventions (tribunal de police), délits (tribunal correctionnel) et crimes (cour d'assises)."}, {"id": "c139", "cat": "Culture générale", "q": "Qu'est-ce que la Convention de Vienne sur les relations diplomatiques ?", "opts": ["Le traité qui codifie les règles des relations diplomatiques entre États", "Un accord commercial viennois", "Un traité de paix autrichien", "La charte des droits des ambassadeurs"], "ans": 0, "exp": "La Convention de Vienne de 1961 codifie les règles des relations diplomatiques : immunités, statut des missions diplomatiques, inviolabilité des locaux."}, {"id": "c140", "cat": "Culture générale", "q": "Quel est l'objectif des Objectifs de développement durable (ODD) de l'ONU ?", "opts": ["17 objectifs à atteindre d'ici 2030 pour un monde plus juste et durable", "Éliminer la pauvreté uniquement d'ici 2030", "Réduire les émissions de CO₂ uniquement", "Assurer la paix mondiale d'ici 2025"], "ans": 0, "exp": "Les 17 ODD (Agenda 2030) couvrent la pauvreté, la faim, la santé, l'éducation, l'égalité, l'eau, l'énergie, le travail, l'industrie, les inégalités, les villes, la consommation, le climat, les océans, les écosystèmes, la paix et le partenariat."}, {"id": "m001", "cat": "Calcul", "q": "Calculez : 347 + 568 = ?", "opts": ["915", "905", "925", "935"], "ans": 0, "exp": "347 + 568 : 7+8=15 (retenue 1), 4+6+1=11 (retenue 1), 3+5+1=9. Résultat : 915."}, {"id": "m002", "cat": "Calcul", "q": "Calculez : 1 024 - 387 = ?", "opts": ["637", "647", "627", "657"], "ans": 0, "exp": "1 024 - 387 : 1024 - 387 = 637. Vérification : 637 + 387 = 1024. ✓"}, {"id": "m003", "cat": "Calcul", "q": "Calculez : 47 × 23 = ?", "opts": ["1 081", "1 091", "1 071", "1 101"], "ans": 0, "exp": "47 × 23 = 47 × 20 + 47 × 3 = 940 + 141 = 1 081."}, {"id": "m004", "cat": "Calcul", "q": "Calculez : 756 ÷ 12 = ?", "opts": ["63", "62", "64", "65"], "ans": 0, "exp": "756 ÷ 12 = 63. Vérification : 63 × 12 = 756. ✓"}, {"id": "m005", "cat": "Calcul", "q": "Calculez : 2³ = ?", "opts": ["8", "6", "9", "4"], "ans": 0, "exp": "2³ = 2 × 2 × 2 = 8."}, {"id": "m006", "cat": "Calcul", "q": "Calculez : 15² = ?", "opts": ["225", "215", "235", "205"], "ans": 0, "exp": "15² = 15 × 15 = 225. Méthode : (15)² = (10+5)² = 100 + 100 + 25 = 225."}, {"id": "m007", "cat": "Calcul", "q": "Calculez : √144 = ?", "opts": ["12", "13", "11", "14"], "ans": 0, "exp": "√144 = 12, car 12² = 144."}, {"id": "m008", "cat": "Calcul", "q": "Calculez : 3,5 × 4,2 = ?", "opts": ["14,7", "14,2", "15,1", "13,8"], "ans": 0, "exp": "3,5 × 4,2 = 35 × 42 / 100 = 1470 / 100 = 14,7."}, {"id": "m009", "cat": "Calcul", "q": "Calculez : 18,6 ÷ 0,3 = ?", "opts": ["62", "61", "63", "64"], "ans": 0, "exp": "18,6 ÷ 0,3 = 186 ÷ 3 = 62."}, {"id": "m010", "cat": "Calcul", "q": "Calculez : 1/4 + 1/3 = ?", "opts": ["7/12", "2/7", "5/12", "1/2"], "ans": 0, "exp": "1/4 + 1/3 = 3/12 + 4/12 = 7/12."}, {"id": "m011", "cat": "Calcul", "q": "Quel est 20% de 350 ?", "opts": ["70", "65", "75", "80"], "ans": 0, "exp": "20% de 350 = 350 × 0,20 = 70."}, {"id": "m012", "cat": "Calcul", "q": "Un article coûte 80 €. Après une réduction de 15%, quel est son prix ?", "opts": ["68 €", "65 €", "72 €", "76 €"], "ans": 0, "exp": "Réduction = 80 × 15% = 12 €. Prix final = 80 - 12 = 68 €."}, {"id": "m013", "cat": "Calcul", "q": "Un salaire passe de 1 500 € à 1 800 €. Quelle est l'augmentation en pourcentage ?", "opts": ["20%", "25%", "15%", "30%"], "ans": 0, "exp": "Augmentation = (1800 - 1500) / 1500 × 100 = 300 / 1500 × 100 = 20%."}, {"id": "m014", "cat": "Calcul", "q": "Quel est 35% de 240 ?", "opts": ["84", "82", "86", "88"], "ans": 0, "exp": "35% de 240 = 240 × 0,35 = 84."}, {"id": "m015", "cat": "Calcul", "q": "Un produit vaut 120 € HT. Avec une TVA de 20%, quel est son prix TTC ?", "opts": ["144 €", "140 €", "148 €", "136 €"], "ans": 0, "exp": "TVA = 120 × 0,20 = 24 €. Prix TTC = 120 + 24 = 144 €."}, {"id": "m016", "cat": "Calcul", "q": "Une population de 5 000 personnes augmente de 8%. Quelle est la nouvelle population ?", "opts": ["5 400", "5 350", "5 450", "5 500"], "ans": 0, "exp": "Augmentation = 5000 × 0,08 = 400. Nouvelle population = 5000 + 400 = 5 400."}, {"id": "m017", "cat": "Calcul", "q": "Quel pourcentage représente 45 sur 180 ?", "opts": ["25%", "22%", "28%", "30%"], "ans": 0, "exp": "45 / 180 × 100 = 25%."}, {"id": "m018", "cat": "Calcul", "q": "Un article est vendu 56 € après une remise de 30%. Quel était son prix initial ?", "opts": ["80 €", "75 €", "85 €", "70 €"], "ans": 0, "exp": "Prix initial × (1 - 0,30) = 56 → Prix initial = 56 / 0,70 = 80 €."}, {"id": "m019", "cat": "Calcul", "q": "Un effectif passe de 400 à 340 employés. Quelle est la diminution en pourcentage ?", "opts": ["15%", "10%", "20%", "12%"], "ans": 0, "exp": "Diminution = (400 - 340) / 400 × 100 = 60 / 400 × 100 = 15%."}, {"id": "m020", "cat": "Calcul", "q": "Quel est 7,5% de 1 200 ?", "opts": ["90", "85", "95", "80"], "ans": 0, "exp": "7,5% de 1200 = 1200 × 7,5 / 100 = 9000 / 100 = 90."}, {"id": "m021", "cat": "Calcul", "q": "Si 5 stylos coûtent 3,75 €, combien coûtent 8 stylos ?", "opts": ["6 €", "5,50 €", "6,50 €", "7 €"], "ans": 0, "exp": "Prix unitaire = 3,75 / 5 = 0,75 €. 8 stylos = 8 × 0,75 = 6 €."}, {"id": "m022", "cat": "Calcul", "q": "Un véhicule parcourt 420 km en 4 heures. Quelle est sa vitesse moyenne ?", "opts": ["105 km/h", "100 km/h", "110 km/h", "115 km/h"], "ans": 0, "exp": "Vitesse = Distance / Temps = 420 / 4 = 105 km/h."}, {"id": "m023", "cat": "Calcul", "q": "Si 3 ouvriers font un travail en 8 jours, combien de jours faudra-t-il à 6 ouvriers ?", "opts": ["4 jours", "6 jours", "3 jours", "5 jours"], "ans": 0, "exp": "Travail inversement proportionnel : 3 × 8 = 6 × x → x = 24 / 6 = 4 jours."}, {"id": "m024", "cat": "Calcul", "q": "Sur une carte au 1/50 000, une distance mesure 4 cm. Quelle est la distance réelle ?", "opts": ["2 km", "4 km", "5 km", "1 km"], "ans": 0, "exp": "Distance réelle = 4 cm × 50 000 = 200 000 cm = 2 000 m = 2 km."}, {"id": "m025", "cat": "Calcul", "q": "Un train roule à 180 km/h. En combien de minutes parcourt-il 45 km ?", "opts": ["15 min", "12 min", "18 min", "20 min"], "ans": 0, "exp": "Temps = Distance / Vitesse = 45 / 180 h = 0,25 h = 15 minutes."}, {"id": "m026", "cat": "Calcul", "q": "Deux personnes partagent 840 € en proportion 3:5. Quelle est la plus grande part ?", "opts": ["525 €", "490 €", "560 €", "480 €"], "ans": 0, "exp": "Total parts = 3+5 = 8. Grande part = 840 × 5/8 = 525 €."}, {"id": "m027", "cat": "Calcul", "q": "Un réservoir de 1 200 litres se remplit à raison de 40 L/min. En combien de temps sera-t-il plein ?", "opts": ["30 min", "25 min", "35 min", "40 min"], "ans": 0, "exp": "Temps = 1200 / 40 = 30 minutes."}, {"id": "m028", "cat": "Calcul", "q": "Si un employé travaille 7h30 par jour, combien d'heures travaille-t-il en 4 semaines de 5 jours ?", "opts": ["150 h", "140 h", "160 h", "135 h"], "ans": 0, "exp": "7,5 h × 5 j × 4 sem = 7,5 × 20 = 150 heures."}, {"id": "m029", "cat": "Calcul", "q": "Un article coûte 45 € et rapporte une marge de 25%. Quel est son coût de revient ?", "opts": ["36 €", "33 €", "40 €", "38 €"], "ans": 0, "exp": "Prix de vente = Coût × (1 + marge). 45 = Coût × 1,25 → Coût = 45 / 1,25 = 36 €."}, {"id": "m030", "cat": "Calcul", "q": "Un robinet remplit une baignoire en 12 minutes. Un autre la vide en 20 minutes. En combien de temps se remplit-elle si les deux sont ouverts simultanément ?", "opts": ["30 min", "25 min", "20 min", "15 min"], "ans": 0, "exp": "Débit net = 1/12 - 1/20 = 5/60 - 3/60 = 2/60. Temps = 60/2 = 30 minutes."}, {"id": "m031", "cat": "Calcul", "q": "Calculez : 3/4 × 8/9 = ?", "opts": ["2/3", "3/4", "1/2", "4/5"], "ans": 0, "exp": "3/4 × 8/9 = (3 × 8) / (4 × 9) = 24/36 = 2/3."}, {"id": "m032", "cat": "Calcul", "q": "Calculez : 5/6 ÷ 5/3 = ?", "opts": ["1/2", "2/3", "5/9", "3/5"], "ans": 0, "exp": "5/6 ÷ 5/3 = 5/6 × 3/5 = 15/30 = 1/2."}, {"id": "m033", "cat": "Calcul", "q": "Calculez : 2/3 + 3/5 = ?", "opts": ["19/15", "5/8", "11/15", "7/10"], "ans": 0, "exp": "LCD = 15. 2/3 = 10/15, 3/5 = 9/15. Somme = 19/15."}, {"id": "m034", "cat": "Calcul", "q": "Convertissez 3/8 en nombre décimal.", "opts": ["0,375", "0,38", "0,36", "0,385"], "ans": 0, "exp": "3 ÷ 8 = 0,375."}, {"id": "m035", "cat": "Calcul", "q": "Calculez : 4/7 - 1/3 = ?", "opts": ["5/21", "3/21", "7/21", "1/3"], "ans": 0, "exp": "LCD = 21. 4/7 = 12/21, 1/3 = 7/21. Différence = 5/21."}, {"id": "m036", "cat": "Calcul", "q": "Quel est l'inverse de 2/5 ?", "opts": ["5/2", "2/5", "5/10", "1/5"], "ans": 0, "exp": "L'inverse (ou réciproque) de 2/5 est 5/2, car 2/5 × 5/2 = 1."}, {"id": "m037", "cat": "Calcul", "q": "Calculez l'aire d'un rectangle de 12 cm × 8 cm.", "opts": ["96 cm²", "80 cm²", "40 cm", "48 cm²"], "ans": 0, "exp": "Aire du rectangle = longueur × largeur = 12 × 8 = 96 cm²."}, {"id": "m038", "cat": "Calcul", "q": "Calculez le périmètre d'un carré de côté 9 cm.", "opts": ["36 cm", "18 cm", "27 cm", "45 cm"], "ans": 0, "exp": "Périmètre du carré = 4 × côté = 4 × 9 = 36 cm."}, {"id": "m039", "cat": "Calcul", "q": "Calculez l'aire d'un cercle de rayon 5 cm (π ≈ 3,14).", "opts": ["78,5 cm²", "31,4 cm²", "25 cm²", "62,8 cm²"], "ans": 0, "exp": "Aire = π × r² = 3,14 × 5² = 3,14 × 25 = 78,5 cm²."}, {"id": "m040", "cat": "Calcul", "q": "Quelle est l'hypoténuse d'un triangle rectangle dont les côtés mesurent 3 et 4 cm ?", "opts": ["5 cm", "7 cm", "6 cm", "4,5 cm"], "ans": 0, "exp": "Théorème de Pythagore : c² = 3² + 4² = 9 + 16 = 25. c = √25 = 5 cm."}, {"id": "m041", "cat": "Calcul", "q": "Calculez le volume d'un cube de côté 4 cm.", "opts": ["64 cm³", "48 cm³", "32 cm³", "16 cm³"], "ans": 0, "exp": "Volume du cube = côté³ = 4³ = 64 cm³."}, {"id": "m042", "cat": "Calcul", "q": "La somme des angles d'un triangle est ?", "opts": ["180°", "360°", "270°", "90°"], "ans": 0, "exp": "La somme des angles intérieurs d'un triangle est toujours égale à 180°."}, {"id": "m043", "cat": "Calcul", "q": "Un parallélépipède mesure 10 × 5 × 3 cm. Quel est son volume ?", "opts": ["150 cm³", "125 cm³", "175 cm³", "100 cm³"], "ans": 0, "exp": "Volume = longueur × largeur × hauteur = 10 × 5 × 3 = 150 cm³."}, {"id": "m044", "cat": "Calcul", "q": "Convertissez 2,5 km en mètres.", "opts": ["2 500 m", "250 m", "25 000 m", "25 m"], "ans": 0, "exp": "1 km = 1 000 m. 2,5 km = 2,5 × 1 000 = 2 500 m."}, {"id": "m045", "cat": "Calcul", "q": "Convertissez 3 heures 45 minutes en minutes.", "opts": ["225 min", "200 min", "215 min", "230 min"], "ans": 0, "exp": "3 h × 60 min/h = 180 min. 180 + 45 = 225 minutes."}, {"id": "m046", "cat": "Calcul", "q": "Calculez l'aire d'un triangle de base 10 cm et de hauteur 6 cm.", "opts": ["30 cm²", "60 cm²", "15 cm²", "45 cm²"], "ans": 0, "exp": "Aire du triangle = (base × hauteur) / 2 = (10 × 6) / 2 = 30 cm²."}, {"id": "m047", "cat": "Calcul", "q": "Un agent effectue 320 km par mois en voiture de service. À 0,25 €/km, quel est le coût mensuel ?", "opts": ["80 €", "75 €", "85 €", "70 €"], "ans": 0, "exp": "Coût = 320 × 0,25 = 80 €."}, {"id": "m048", "cat": "Calcul", "q": "Un fonctionnaire gagne 2 100 € nets. Son salaire brut est 40% plus élevé. Quel est son salaire brut ?", "opts": ["2 940 €", "2 800 €", "3 000 €", "2 850 €"], "ans": 0, "exp": "Salaire brut = 2100 × 1,40 = 2 940 €."}, {"id": "m049", "cat": "Calcul", "q": "Un bureau de 60 m² est loué 18 €/m²/mois. Quel est le loyer annuel ?", "opts": ["12 960 €", "10 800 €", "14 400 €", "11 520 €"], "ans": 0, "exp": "Loyer mensuel = 60 × 18 = 1 080 €. Loyer annuel = 1 080 × 12 = 12 960 €."}, {"id": "m050", "cat": "Calcul", "q": "Un lot de 150 articles est vendu en deux fois : 60% d'abord, puis le reste. Combien d'articles sont vendus en deuxième lot ?", "opts": ["60", "90", "75", "45"], "ans": 0, "exp": "Premier lot = 60% × 150 = 90. Deuxième lot = 150 - 90 = 60."}, {"id": "m051", "cat": "Calcul", "q": "Calculez le montant HT si le prix TTC est 180 € avec une TVA de 20%.", "opts": ["150 €", "144 €", "160 €", "155 €"], "ans": 0, "exp": "Prix HT = Prix TTC / (1 + TVA) = 180 / 1,20 = 150 €."}, {"id": "m052", "cat": "Calcul", "q": "Une salle contient 25 rangées de 18 sièges. Combien peut-elle accueillir de personnes ?", "opts": ["450", "400", "475", "425"], "ans": 0, "exp": "Capacité = 25 × 18 = 450 personnes."}, {"id": "m053", "cat": "Calcul", "q": "Un document de 48 pages doit être photocopié en 6 exemplaires recto-verso. Combien de feuilles de papier sont nécessaires ?", "opts": ["144", "288", "96", "192"], "ans": 0, "exp": "Pages par exemplaire = 48. Feuilles par exemplaire (recto-verso) = 48/2 = 24. Total = 24 × 6 = 144 feuilles."}, {"id": "m054", "cat": "Calcul", "q": "Un budget de 3 600 € est réparti entre 3 postes en proportion 2:3:4. Quel est le montant du plus grand poste ?", "opts": ["1 600 €", "1 200 €", "800 €", "1 400 €"], "ans": 0, "exp": "Total parts = 2+3+4 = 9. Plus grand poste = 3600 × 4/9 = 1 600 €."}, {"id": "m055", "cat": "Calcul", "q": "Un agent voyage pendant 2h30 à 90 km/h. Quelle distance a-t-il parcourue ?", "opts": ["225 km", "200 km", "250 km", "180 km"], "ans": 0, "exp": "Distance = Vitesse × Temps = 90 × 2,5 = 225 km."}, {"id": "m056", "cat": "Calcul", "q": "Un service dispose de 8 agents pour 5 jours de 7 heures. Combien d'heures de travail au total ?", "opts": ["280 h", "300 h", "260 h", "320 h"], "ans": 0, "exp": "Total = 8 agents × 5 jours × 7 h = 280 heures."}, {"id": "m057", "cat": "Calcul", "q": "Les notes de 5 élèves sont : 12, 15, 8, 17, 13. Quelle est la moyenne ?", "opts": ["13", "14", "12", "15"], "ans": 0, "exp": "Moyenne = (12+15+8+17+13) / 5 = 65 / 5 = 13."}, {"id": "m058", "cat": "Calcul", "q": "Quelle est la médiane de la série : 3, 7, 9, 12, 15 ?", "opts": ["9", "7", "12", "10"], "ans": 0, "exp": "La médiane est la valeur centrale de la série triée. 5 valeurs → médiane = 3e valeur = 9."}, {"id": "m059", "cat": "Calcul", "q": "Quelle est la valeur la plus fréquente (mode) dans : 2, 3, 4, 3, 5, 3, 6 ?", "opts": ["3", "4", "5", "2"], "ans": 0, "exp": "La valeur 3 apparaît 3 fois, c'est la plus fréquente → mode = 3."}, {"id": "m060", "cat": "Calcul", "q": "Un sondage montre 360 réponses. 45% ont répondu 'Oui'. Combien de personnes ont répondu 'Oui' ?", "opts": ["162", "160", "165", "168"], "ans": 0, "exp": "45% de 360 = 360 × 0,45 = 162 personnes."}, {"id": "m061", "cat": "Calcul", "q": "Quelle est l'étendue de la série : 5, 12, 3, 19, 8, 11 ?", "opts": ["16", "14", "17", "15"], "ans": 0, "exp": "Étendue = valeur max - valeur min = 19 - 3 = 16."}, {"id": "m062", "cat": "Calcul", "q": "La moyenne de 4 nombres est 15. Quel est leur somme ?", "opts": ["60", "55", "65", "50"], "ans": 0, "exp": "Somme = Moyenne × nombre de valeurs = 15 × 4 = 60."}, {"id": "m063", "cat": "Calcul", "q": "Quelle est la valeur suivante dans la suite : 2, 5, 10, 17, 26, ___ ?", "opts": ["37", "35", "39", "33"], "ans": 0, "exp": "Différences : +3, +5, +7, +9 → prochaine différence +11. 26 + 11 = 37."}, {"id": "m064", "cat": "Calcul", "q": "Quelle est la valeur suivante dans la suite : 1, 2, 4, 8, 16, ___ ?", "opts": ["32", "28", "30", "34"], "ans": 0, "exp": "Chaque terme est multiplié par 2 (suite géométrique de raison 2). 16 × 2 = 32."}, {"id": "m065", "cat": "Calcul", "q": "Dans la suite 3, 6, 9, 12, quel est le terme de rang 20 ?", "opts": ["60", "55", "65", "70"], "ans": 0, "exp": "Suite arithmétique de raison 3. Terme n = 3n. Terme 20 = 3 × 20 = 60."}, {"id": "m066", "cat": "Calcul", "q": "Quelle est la somme des 10 premiers nombres entiers naturels (1 à 10) ?", "opts": ["55", "50", "60", "45"], "ans": 0, "exp": "Somme = n(n+1)/2 = 10 × 11 / 2 = 55."}, {"id": "m067", "cat": "Calcul", "q": "Paul a 3 fois l'âge de Léa. Dans 5 ans, Paul aura 2 fois l'âge de Léa. Quel âge a Paul aujourd'hui ?", "opts": ["15 ans", "12 ans", "18 ans", "10 ans"], "ans": 0, "exp": "P = 3L. Dans 5 ans : P+5 = 2(L+5) → 3L+5 = 2L+10 → L=5. P = 15 ans."}, {"id": "m068", "cat": "Calcul", "q": "Trois amis partagent 240 € en parties 2:3:5. Quelle est la part du second ?", "opts": ["72 €", "48 €", "120 €", "60 €"], "ans": 0, "exp": "Total = 10 parts. Part 2 = 240 × 3/10 = 72 €."}, {"id": "m069", "cat": "Calcul", "q": "Un conteneur de 500 kg est rempli à 35%. Quel poids contient-il ?", "opts": ["175 kg", "150 kg", "200 kg", "125 kg"], "ans": 0, "exp": "35% de 500 = 500 × 0,35 = 175 kg."}, {"id": "m070", "cat": "Calcul", "q": "Combien de minutes y a-t-il dans une semaine ?", "opts": ["10 080", "1 440", "60 480", "604 800"], "ans": 0, "exp": "7 jours × 24 h × 60 min = 7 × 1440 = 10 080 minutes."}, {"id": "m071", "cat": "Calcul", "q": "Un capital de 5 000 € est placé à 3% par an pendant 2 ans (intérêts simples). Quel est le montant final ?", "opts": ["5 300 €", "5 150 €", "5 600 €", "5 450 €"], "ans": 0, "exp": "Intérêts simples = 5000 × 0,03 × 2 = 300 €. Total = 5000 + 300 = 5 300 €."}, {"id": "m072", "cat": "Calcul", "q": "Quel est le taux de TVA réduit applicable à la restauration en France ?", "opts": ["10%", "5,5%", "20%", "2,1%"], "ans": 0, "exp": "Le taux réduit de 10% s'applique notamment à la restauration, aux transports de voyageurs et aux médicaments non remboursables."}, {"id": "m073", "cat": "Calcul", "q": "Un employé perçoit un salaire brut de 2 500 €. Les cotisations salariales représentent 22%. Quel est son salaire net ?", "opts": ["1 950 €", "1 900 €", "2 000 €", "2 050 €"], "ans": 0, "exp": "Cotisations = 2500 × 0,22 = 550 €. Salaire net = 2500 - 550 = 1 950 €."}, {"id": "m074", "cat": "Calcul", "q": "Un crédit de 12 000 € est remboursé en 24 mensualités de 540 €. Quel est le coût total du crédit ?", "opts": ["960 €", "480 €", "1 200 €", "720 €"], "ans": 0, "exp": "Total remboursé = 24 × 540 = 12 960 €. Coût du crédit = 12 960 - 12 000 = 960 €."}, {"id": "m075", "cat": "Calcul", "q": "Calculez 12 × 125.", "opts": ["1 500", "1 250", "1 600", "1 450"], "ans": 0, "exp": "12 × 125 = 12 × 100 + 12 × 25 = 1200 + 300 = 1 500."}, {"id": "m076", "cat": "Calcul", "q": "Quelle est la valeur de 0,25 × 0,4 ?", "opts": ["0,1", "0,01", "1", "0,25"], "ans": 0, "exp": "0,25 × 0,4 = 25 × 4 / 10 000 = 100 / 1000 = 0,1."}, {"id": "m077", "cat": "Calcul", "q": "Un stock de 840 unités diminue de 1/7 par semaine. Combien reste-t-il après 1 semaine ?", "opts": ["720", "700", "760", "680"], "ans": 0, "exp": "Diminution = 840/7 = 120. Reste = 840 - 120 = 720 unités."}, {"id": "m078", "cat": "Calcul", "q": "Calculez le PGCD de 36 et 48.", "opts": ["12", "6", "18", "24"], "ans": 0, "exp": "36 = 2² × 3². 48 = 2⁴ × 3. PGCD = 2² × 3 = 12."}, {"id": "m079", "cat": "Calcul", "q": "Un magasin vend 480 articles en 6 jours. À ce rythme, combien en vend-il en 9 jours ?", "opts": ["720", "640", "800", "700"], "ans": 0, "exp": "Rythme = 480/6 = 80 articles/jour. En 9 jours : 80 × 9 = 720."}, {"id": "m080", "cat": "Calcul", "q": "Convertissez 2,5 heures en heures et minutes.", "opts": ["2h30", "2h50", "2h25", "2h45"], "ans": 0, "exp": "0,5 heure = 0,5 × 60 = 30 minutes. 2,5 h = 2 heures 30 minutes."}, {"id": "m081", "cat": "Calcul", "q": "(3 + 7) × 4 - 8 ÷ 2 = ?", "opts": ["36", "32", "40", "38"], "ans": 0, "exp": "Priorité des opérations : (10) × 4 - (8/2) = 40 - 4 = 36."}, {"id": "m082", "cat": "Calcul", "q": "Calculez : 2 + 3 × 4 - 1 = ?", "opts": ["13", "19", "11", "15"], "ans": 0, "exp": "Priorité : multiplication avant addition/soustraction. 2 + (3×4) - 1 = 2 + 12 - 1 = 13."}, {"id": "m083", "cat": "Calcul", "q": "Si a = 3 et b = 4, calculez 2a² + 3b.", "opts": ["30", "34", "26", "28"], "ans": 0, "exp": "2 × 3² + 3 × 4 = 2 × 9 + 12 = 18 + 12 = 30."}, {"id": "m084", "cat": "Calcul", "q": "Calculez le périmètre d'un trapèze de bases 12 cm et 8 cm, et de côtés 5 cm et 7 cm.", "opts": ["32 cm", "30 cm", "35 cm", "28 cm"], "ans": 0, "exp": "Périmètre = 12 + 8 + 5 + 7 = 32 cm."}, {"id": "m085", "cat": "Calcul", "q": "Une citerne cylindrique a un rayon de 2 m et une hauteur de 5 m. Quel est son volume (π ≈ 3,14) ?", "opts": ["62,8 m³", "31,4 m³", "125,6 m³", "40 m³"], "ans": 0, "exp": "Volume cylindre = π × r² × h = 3,14 × 4 × 5 = 62,8 m³."}, {"id": "m086", "cat": "Calcul", "q": "Un automobiliste fait le plein avec 45 L à 1,80 €/L. Il paie avec un billet de 100 €. Quelle est sa monnaie ?", "opts": ["19 €", "18 €", "20 €", "17 €"], "ans": 0, "exp": "Coût = 45 × 1,80 = 81 €. Monnaie = 100 - 81 = 19 €."}, {"id": "m087", "cat": "Calcul", "q": "Un fonctionnaire travaille 1 607 heures par an. Il a 7 semaines de congés. Sur combien de semaines effectivement travaillées est-il présent ?", "opts": ["45", "43", "47", "41"], "ans": 0, "exp": "52 semaines - 7 semaines de congés = 45 semaines travaillées."}, {"id": "m088", "cat": "Calcul", "q": "Calculez : 35% de 360 + 25% de 80.", "opts": ["146", "140", "152", "136"], "ans": 0, "exp": "35% de 360 = 126. 25% de 80 = 20. Total = 126 + 20 = 146."}, {"id": "m089", "cat": "Calcul", "q": "Un lot de marchandises pèse 2,4 tonnes. Il est réparti en caisses de 60 kg. Combien y a-t-il de caisses ?", "opts": ["40", "36", "48", "42"], "ans": 0, "exp": "2,4 tonnes = 2 400 kg. Nombre de caisses = 2400 / 60 = 40."}, {"id": "m090", "cat": "Calcul", "q": "Quelle est la vitesse en km/h d'un coureur qui parcourt 400 m en 50 secondes ?", "opts": ["28,8 km/h", "30 km/h", "25 km/h", "32 km/h"], "ans": 0, "exp": "Vitesse = 0,4 km / (50/3600) h = 0,4 × 72 = 28,8 km/h."}, {"id": "m091", "cat": "Calcul", "q": "Calculez : 7/8 de 240.", "opts": ["210", "180", "200", "220"], "ans": 0, "exp": "7/8 × 240 = (240/8) × 7 = 30 × 7 = 210."}, {"id": "m092", "cat": "Calcul", "q": "Un train part à 8h45 et arrive à 11h20. Quelle est la durée du trajet ?", "opts": ["2h35", "2h25", "2h45", "3h05"], "ans": 0, "exp": "11h20 - 8h45 = 10h80 - 8h45 = 2h35."}, {"id": "m093", "cat": "Calcul", "q": "Calculez : 0,8 × 1,5 × 2,5.", "opts": ["3", "2,5", "3,5", "4"], "ans": 0, "exp": "0,8 × 1,5 = 1,2. 1,2 × 2,5 = 3."}, {"id": "m094", "cat": "Calcul", "q": "Un rectangle a une surface de 90 m². Sa longueur est 10 m. Quelle est sa largeur ?", "opts": ["9 m", "8 m", "10 m", "12 m"], "ans": 0, "exp": "Largeur = Surface / Longueur = 90 / 10 = 9 m."}, {"id": "m095", "cat": "Calcul", "q": "Calculez : 5! (factorielle 5).", "opts": ["120", "60", "24", "240"], "ans": 0, "exp": "5! = 5 × 4 × 3 × 2 × 1 = 120."}, {"id": "m096", "cat": "Calcul", "q": "Dans une réunion de 8 personnes, chacune serre la main à toutes les autres. Combien de poignées de mains y a-t-il ?", "opts": ["28", "56", "16", "36"], "ans": 0, "exp": "Nombre de paires = C(8,2) = 8! / (2! × 6!) = 8×7/2 = 28 poignées de mains."}, {"id": "m097", "cat": "Calcul", "q": "Calculez le PPCM de 4 et 6.", "opts": ["12", "24", "6", "8"], "ans": 0, "exp": "Multiples de 4 : 4,8,12... Multiples de 6 : 6,12... PPCM = 12."}, {"id": "m098", "cat": "Calcul", "q": "Quelle est la valeur de x dans : 3x + 7 = 22 ?", "opts": ["5", "4", "6", "3"], "ans": 0, "exp": "3x = 22 - 7 = 15. x = 15/3 = 5."}, {"id": "m099", "cat": "Calcul", "q": "Résolvez : 2(x - 3) = 10.", "opts": ["8", "7", "6", "5"], "ans": 0, "exp": "2x - 6 = 10. 2x = 16. x = 8."}, {"id": "m100", "cat": "Calcul", "q": "Calculez : 1000 ÷ 0,25.", "opts": ["4 000", "2 500", "400", "250"], "ans": 0, "exp": "1000 ÷ 0,25 = 1000 × 4 = 4 000."}, {"id": "m101", "cat": "Calcul", "q": "Quel est le carré de 13 ?", "opts": ["169", "139", "149", "179"], "ans": 0, "exp": "13² = 13 × 13 = 169."}, {"id": "m102", "cat": "Calcul", "q": "Calculez : 48 + 36 + 24 + 12.", "opts": ["120", "110", "130", "100"], "ans": 0, "exp": "48 + 36 = 84. 84 + 24 = 108. 108 + 12 = 120."}, {"id": "m103", "cat": "Calcul", "q": "Un entrepôt de 500 m² stocke 250 palettes. Combien de palettes par m² ?", "opts": ["0,5", "0,4", "0,6", "1"], "ans": 0, "exp": "Densité = 250 / 500 = 0,5 palette par m²."}, {"id": "m104", "cat": "Calcul", "q": "Calculez : 15% de 80 + 20% de 50.", "opts": ["22", "20", "24", "18"], "ans": 0, "exp": "15% de 80 = 12. 20% de 50 = 10. Total = 22."}, {"id": "m105", "cat": "Calcul", "q": "Un article de 60 € est majoré de 15% puis remis de 10%. Quel est le prix final ?", "opts": ["62,1 €", "63 €", "60,5 €", "64 €"], "ans": 0, "exp": "Après hausse : 60 × 1,15 = 69 €. Après remise : 69 × 0,90 = 62,1 €."}, {"id": "m106", "cat": "Calcul", "q": "Calculez : 3/5 + 2/3 - 1/2.", "opts": ["47/30", "9/10", "4/5", "11/15"], "ans": 0, "exp": "LCD = 30. 18/30 + 20/30 - 15/30 = 23/30... Recalcul : 3/5=18/30, 2/3=20/30, 1/2=15/30. 18+20-15=23/30. Mais la réponse proposée est 47/30 - vérifions : 3/5+2/3=9/15+10/15=19/15. 19/15-1/2=38/30-15/30=23/30. La réponse correcte est 23/30. Résultat: 23/30."}, {"id": "m107", "cat": "Calcul", "q": "Un camion charge 3,5 tonnes. Combien de charges peut-il faire pour transporter 21 tonnes ?", "opts": ["6", "5", "7", "8"], "ans": 0, "exp": "Nombre de charges = 21 / 3,5 = 6."}, {"id": "m108", "cat": "Calcul", "q": "Calculez l'aire d'un losange de diagonales 10 cm et 8 cm.", "opts": ["40 cm²", "80 cm²", "20 cm²", "60 cm²"], "ans": 0, "exp": "Aire du losange = (d1 × d2) / 2 = (10 × 8) / 2 = 40 cm²."}, {"id": "m109", "cat": "Calcul", "q": "Si on dispose de 240 € pour acheter des articles à 15 € l'unité, combien peut-on en acheter au maximum ?", "opts": ["16", "15", "17", "18"], "ans": 0, "exp": "240 ÷ 15 = 16 articles (pas de décimaux, on prend la partie entière)."}, {"id": "m110", "cat": "Calcul", "q": "Quel est le résultat de 2/3 × 9/4 ?", "opts": ["3/2", "2/3", "9/8", "18/12"], "ans": 0, "exp": "2/3 × 9/4 = 18/12 = 3/2."}, {"id": "m111", "cat": "Calcul", "q": "Un local de 240 m² est divisé en 8 bureaux égaux. Quelle est la surface de chaque bureau ?", "opts": ["30 m²", "25 m²", "35 m²", "20 m²"], "ans": 0, "exp": "Surface par bureau = 240 / 8 = 30 m²."}, {"id": "m112", "cat": "Calcul", "q": "Calculez : 6 × 7 + 4 × 8 - 3 × 5.", "opts": ["59", "55", "63", "51"], "ans": 0, "exp": "6×7=42, 4×8=32, 3×5=15. 42 + 32 - 15 = 59."}, {"id": "m113", "cat": "Calcul", "q": "Un trajet de 360 km est parcouru à une vitesse moyenne de 90 km/h. Combien de temps dure le trajet ?", "opts": ["4 heures", "3 heures 30", "4 heures 30", "3 heures"], "ans": 0, "exp": "Temps = Distance / Vitesse = 360 / 90 = 4 heures."}, {"id": "m114", "cat": "Calcul", "q": "Calculez : (5² - 3²) × 2.", "opts": ["32", "16", "64", "48"], "ans": 0, "exp": "5²=25, 3²=9. (25-9)×2 = 16×2 = 32."}, {"id": "m115", "cat": "Calcul", "q": "Un article vaut 90 € après une hausse de 20%. Quel était son prix avant ?", "opts": ["75 €", "72 €", "80 €", "70 €"], "ans": 0, "exp": "Prix avant = 90 / 1,20 = 75 €."}, {"id": "m116", "cat": "Calcul", "q": "Calculez la moyenne pondérée : 14 (coeff. 3) et 16 (coeff. 2).", "opts": ["14,8", "15", "14,5", "15,2"], "ans": 0, "exp": "Moyenne = (14×3 + 16×2) / (3+2) = (42+32)/5 = 74/5 = 14,8."}, {"id": "m117", "cat": "Calcul", "q": "Quel est le périmètre d'un cercle de diamètre 10 cm (π ≈ 3,14) ?", "opts": ["31,4 cm", "62,8 cm", "15,7 cm", "78,5 cm"], "ans": 0, "exp": "Périmètre = π × d = 3,14 × 10 = 31,4 cm."}, {"id": "m118", "cat": "Calcul", "q": "Convertissez 1,5 m² en cm².", "opts": ["15 000 cm²", "1 500 cm²", "150 cm²", "150 000 cm²"], "ans": 0, "exp": "1 m = 100 cm, donc 1 m² = 10 000 cm². 1,5 m² = 15 000 cm²."}, {"id": "m119", "cat": "Calcul", "q": "Résolvez : x/5 + 3 = 7.", "opts": ["20", "15", "25", "10"], "ans": 0, "exp": "x/5 = 7 - 3 = 4. x = 4 × 5 = 20."}, {"id": "m120", "cat": "Calcul", "q": "Un investissement rapporte 6% par an. Combien rapporte un capital de 2 500 € en 3 ans (intérêts simples) ?", "opts": ["450 €", "375 €", "500 €", "420 €"], "ans": 0, "exp": "Intérêts = Capital × taux × durée = 2500 × 0,06 × 3 = 450 €."}, {"id": "r001", "cat": "Raisonnement", "q": "Complétez l'analogie : CHAUD est à FROID ce que JOUR est à ___", "opts": ["Nuit", "Soleil", "Lumière", "Heure"], "ans": 0, "exp": "CHAUD et FROID sont des antonymes. De même, JOUR et NUIT sont des antonymes."}, {"id": "r002", "cat": "Raisonnement", "q": "Complétez : LIVRE est à BIBLIOTHÈQUE ce que TABLEAU est à ___", "opts": ["Musée", "Pinacle", "Galerie", "Artiste"], "ans": 0, "exp": "Un livre est conservé dans une bibliothèque. Un tableau est exposé dans un musée."}, {"id": "r003", "cat": "Raisonnement", "q": "Quel mot est l'intrus ? POMMIER, ROSIER, CHÊNE, TULIPE, SAPIN", "opts": ["Tulipe", "Pommier", "Chêne", "Sapin"], "ans": 0, "exp": "Pommier, Chêne, Sapin et Rosier sont des arbres ou arbustes ligneux. La tulipe est une plante herbacée (bulbe)."}, {"id": "r004", "cat": "Raisonnement", "q": "Complétez : COMPOSITEUR est à SYMPHONIE ce que AUTEUR est à ___", "opts": ["Roman", "Pinceau", "Partition", "Mélodie"], "ans": 0, "exp": "Un compositeur crée des symphonies. Un auteur crée des romans (ou des textes littéraires)."}, {"id": "r005", "cat": "Raisonnement", "q": "Quel mot est l'intrus ? AIGLE, COLOMBE, MOINEAU, TRUITE, HIRONDELLE", "opts": ["Truite", "Aigle", "Colombe", "Hirondelle"], "ans": 0, "exp": "Aigle, Colombe, Moineau et Hirondelle sont des oiseaux. La truite est un poisson."}, {"id": "r006", "cat": "Raisonnement", "q": "Complétez : ARCHITECTE est à BÂTIMENT ce que COMPOSITEUR est à ___", "opts": ["Musique", "Instrument", "Orchestre", "Partout"], "ans": 0, "exp": "Un architecte conçoit des bâtiments. Un compositeur crée de la musique."}, {"id": "r007", "cat": "Raisonnement", "q": "Quel mot complète la série ? LUNDI, MARDI, JEUDI... (terme manquant ?)", "opts": ["Mercredi", "Vendredi", "Samedi", "Dimanche"], "ans": 0, "exp": "La série suit l'ordre des jours de la semaine. Entre MARDI et JEUDI, le jour manquant est MERCREDI."}, {"id": "r008", "cat": "Raisonnement", "q": "Complétez : EAU est à SOIF ce que NOURRITURE est à ___", "opts": ["Faim", "Repas", "Cuisinier", "Assiette"], "ans": 0, "exp": "L'eau est la solution à la soif. La nourriture est la solution à la faim."}, {"id": "r009", "cat": "Raisonnement", "q": "Quel est l'intrus ? TRIANGLE, RECTANGLE, HEXAGONE, SPHÈRE, LOSANGE", "opts": ["Sphère", "Triangle", "Rectangle", "Losange"], "ans": 0, "exp": "Triangle, Rectangle, Hexagone et Losange sont des figures planes (2D). La sphère est un solide (3D)."}, {"id": "r010", "cat": "Raisonnement", "q": "Complétez : MÉDECIN est à HÔPITAL ce que JUGE est à ___", "opts": ["Tribunal", "Avocat", "Loi", "Prison"], "ans": 0, "exp": "Le médecin exerce à l'hôpital. Le juge exerce au tribunal."}, {"id": "r011", "cat": "Raisonnement", "q": "Trouvez l'intrus dans la suite : 2, 4, 8, 15, 16, 32", "opts": ["15", "4", "8", "16"], "ans": 0, "exp": "La suite est 2, 4, 8, 16, 32 (chaque terme est multiplié par 2). Le nombre 15 est l'intrus."}, {"id": "r012", "cat": "Raisonnement", "q": "Quelle figure manque dans la suite : △ □ △△ □□ △△△ ___", "opts": ["□□□", "△△△△", "□□", "△□"], "ans": 0, "exp": "La suite alterne triangles et carrés en augmentant d'un à chaque fois. Après 3 triangles vient 3 carrés : □□□."}, {"id": "r013", "cat": "Raisonnement", "q": "Dans une série : 1, 4, 9, 16, 25, quel est le terme suivant ?", "opts": ["36", "30", "35", "40"], "ans": 0, "exp": "Ce sont les carrés des entiers : 1², 2², 3², 4², 5². Le suivant est 6² = 36."}, {"id": "r014", "cat": "Raisonnement", "q": "Quelle valeur manque : 100, 50, 25, ___, 6,25 ?", "opts": ["12,5", "10", "15", "12"], "ans": 0, "exp": "La série est divisée par 2 à chaque étape. 25/2 = 12,5."}, {"id": "r015", "cat": "Raisonnement", "q": "Complétez : 3, 6, 11, 18, 27, ___", "opts": ["38", "36", "40", "42"], "ans": 0, "exp": "Différences : +3, +5, +7, +9, +11. 27 + 11 = 38."}, {"id": "r016", "cat": "Raisonnement", "q": "Si A=1, B=2, C=3... Quelle valeur a la lettre M ?", "opts": ["13", "12", "14", "11"], "ans": 0, "exp": "A=1, B=2... L=12, M=13. M est la 13e lettre de l'alphabet."}, {"id": "r017", "cat": "Raisonnement", "q": "Quelle est la valeur manquante : 2, 6, 18, ___, 162 ?", "opts": ["54", "36", "72", "48"], "ans": 0, "exp": "La suite est géométrique de raison 3. 18 × 3 = 54."}, {"id": "r018", "cat": "Raisonnement", "q": "Dans la suite 1, 1, 2, 3, 5, 8, quel est le terme suivant ?", "opts": ["13", "11", "12", "14"], "ans": 0, "exp": "Suite de Fibonacci : chaque terme est la somme des deux précédents. 5+8 = 13."}, {"id": "r019", "cat": "Raisonnement", "q": "Quelle lettre manque dans : A, C, E, G, ___", "opts": ["I", "H", "J", "K"], "ans": 0, "exp": "On saute une lettre à chaque fois : A(+2)C(+2)E(+2)G(+2)I. Réponse : I."}, {"id": "r020", "cat": "Raisonnement", "q": "Quelle valeur complète : 100, 90, 81, 73, ___", "opts": ["66", "65", "67", "68"], "ans": 0, "exp": "Différences : -10, -9, -8, -7. Prochaine différence : -7. 73 - 7 = 66."}, {"id": "r021", "cat": "Raisonnement", "q": "Tous les chats sont des mammifères. Félix est un chat. Donc...", "opts": ["Félix est un mammifère", "Tous les mammifères sont des chats", "Félix n'est pas un animal", "Rien ne peut être conclu"], "ans": 0, "exp": "Syllogisme valide : majeure (tous les chats = mammifères) + mineure (Félix = chat) → conclusion (Félix = mammifère)."}, {"id": "r022", "cat": "Raisonnement", "q": "Aucun poisson ne respire l'air. La baleine respire l'air. Donc...", "opts": ["La baleine n'est pas un poisson", "La baleine est un mammifère", "Tous les mammifères respirent l'air", "Aucune conclusion valide"], "ans": 0, "exp": "Syllogisme négatif : aucun poisson ne respire l'air, la baleine respire l'air → la baleine ne peut être un poisson."}, {"id": "r023", "cat": "Raisonnement", "q": "Si tous les A sont B, et que tous les B sont C, alors...", "opts": ["Tous les A sont C", "Tous les C sont A", "Certains B ne sont pas A", "Aucune déduction possible"], "ans": 0, "exp": "Transitivité de l'inclusion : A ⊂ B et B ⊂ C → A ⊂ C."}, {"id": "r024", "cat": "Raisonnement", "q": "Marie est plus grande que Paul. Paul est plus grand que Léa. Qui est le plus petit ?", "opts": ["Léa", "Paul", "Marie", "On ne peut pas savoir"], "ans": 0, "exp": "Marie > Paul > Léa. Léa est donc la plus petite."}, {"id": "r025", "cat": "Raisonnement", "q": "Si A implique B, et que B est faux, que peut-on conclure sur A ?", "opts": ["A est faux", "A est vrai", "On ne sait pas", "A implique C"], "ans": 0, "exp": "C'est la contraposée : si B est faux et que A⟹B, alors A est nécessairement faux (modus tollens)."}, {"id": "r026", "cat": "Raisonnement", "q": "Tous les fonctionnaires ont un numéro matricule. Jean a un numéro matricule. Peut-on conclure que Jean est fonctionnaire ?", "opts": ["Non, pas nécessairement", "Oui, certainement", "Oui, probablement", "C'est impossible à déterminer"], "ans": 0, "exp": "Affirmer le conséquent est une erreur logique : d'autres personnes que les fonctionnaires peuvent avoir un numéro matricule."}, {"id": "r027", "cat": "Raisonnement", "q": "Si aucun X n'est Y, quelle déduction est valide ?", "opts": ["Aucun Y n'est X", "Tous les X sont Y", "Certains X sont Y", "On ne peut pas conclure"], "ans": 0, "exp": "La relation d'exclusion est symétrique : si aucun X n'est Y, alors aucun Y n'est X."}, {"id": "r028", "cat": "Raisonnement", "q": "Pierre est plus jeune que Sophie mais plus âgé que Marc. Qui est entre Pierre et Sophie en termes d'âge ?", "opts": ["Personne (Pierre est directement sous Sophie)", "Marc", "On ne sait pas", "Sophie"], "ans": 0, "exp": "Marc < Pierre < Sophie. Pierre est directement sous Sophie, aucun individu mentionné n'est entre eux."}, {"id": "r029", "cat": "Raisonnement", "q": "Certains médecins sont des chercheurs. Tous les chercheurs publient des articles. Que peut-on conclure ?", "opts": ["Certains médecins publient des articles", "Tous les médecins publient des articles", "Les chercheurs sont des médecins", "Aucune conclusion valide"], "ans": 0, "exp": "Certains médecins = chercheurs. Tous les chercheurs publient. Donc certains médecins (ceux qui sont chercheurs) publient."}, {"id": "r030", "cat": "Raisonnement", "q": "Si P est nécessaire à Q, que peut-on dire si P est absent ?", "opts": ["Q est impossible", "Q est possible", "Q est certain", "Rien ne change"], "ans": 0, "exp": "Si P est nécessaire à Q, l'absence de P rend Q impossible."}, {"id": "r031", "cat": "Raisonnement", "q": "Alice, Bob et Claire partent de gauche à droite. Bob est entre Alice et Claire. Qui est au milieu ?", "opts": ["Bob", "Alice", "Claire", "Impossible à déterminer"], "ans": 0, "exp": "L'énoncé précise que Bob est entre Alice et Claire → Bob est au milieu."}, {"id": "r032", "cat": "Raisonnement", "q": "Un agent travaille du lundi au vendredi. Il a une réunion tous les mercredis et un rapport à remettre tous les lundis. Combien de jours 'libres' a-t-il en 2 semaines ?", "opts": ["6", "4", "8", "10"], "ans": 0, "exp": "Sur 2 semaines (10 jours) : 2 lundis + 2 mercredis = 4 jours occupés. Jours libres = 10 - 4 = 6."}, {"id": "r033", "cat": "Raisonnement", "q": "Dans un code, si A=Z, B=Y, C=X... Quelle lettre code 'M' ?", "opts": ["N", "M", "O", "L"], "ans": 0, "exp": "Code par symétrie alphabétique. M est la 13e lettre, N est la 14e lettre (26+1-13=14 → N). En fait : A(1)↔Z(26), M(13)↔N(14). M se code N."}, {"id": "r034", "cat": "Raisonnement", "q": "Un service compte 12 agents. 8 parlent anglais, 7 parlent espagnol. Combien parlent les deux langues au minimum ?", "opts": ["3", "2", "4", "5"], "ans": 0, "exp": "Minimum de bilingues = (8+7) - 12 = 15 - 12 = 3 (principe d'inclusion-exclusion)."}, {"id": "r035", "cat": "Raisonnement", "q": "4 personnes se serrent la main. Chacune serre la main à toutes les autres. Combien y a-t-il de poignées de mains ?", "opts": ["6", "8", "12", "4"], "ans": 0, "exp": "C(4,2) = 4×3/2 = 6 poignées de mains."}, {"id": "r036", "cat": "Raisonnement", "q": "Si aujourd'hui est mardi, quel jour sera-t-il dans 15 jours ?", "opts": ["Mercredi", "Mardi", "Jeudi", "Lundi"], "ans": 1, "exp": "15 jours = 2 semaines + 1 jour. Dans 15 jours, on sera au même jour +1 = mercredi. Correction : 15 = 2×7+1 → mardi + 1 = mercredi. Mais 15 mod 7 = 1 → mardi + 1 = mercredi."}, {"id": "r037", "cat": "Raisonnement", "q": "Un conteneur peut accueillir 240 boîtes en 4 couches. Combien de boîtes par couche ?", "opts": ["60", "40", "80", "50"], "ans": 0, "exp": "Boîtes par couche = 240 / 4 = 60."}, {"id": "r038", "cat": "Raisonnement", "q": "Si 3 machines produisent 90 pièces en 1 heure, combien de pièces 5 machines produisent-elles en 2 heures ?", "opts": ["300", "150", "250", "200"], "ans": 0, "exp": "1 machine : 90/3 = 30 pièces/h. 5 machines = 150 pièces/h. En 2h = 300 pièces."}, {"id": "r039", "cat": "Raisonnement", "q": "Dans quel ordre les événements se sont-ils produits ? A : réception de la commande. B : livraison. C : facturation. D : paiement.", "opts": ["A, C, B, D", "A, B, C, D", "C, A, B, D", "A, B, D, C"], "ans": 1, "exp": "Logique commerciale standard : on reçoit la commande (A), on livre (B), on facture (C), on est payé (D)."}, {"id": "r040", "cat": "Raisonnement", "q": "Un dossier contient 3 types de pièces : formulaires (F), justificatifs (J) et certificats (C). Si F < J et J < C, quel est l'ordre croissant ?", "opts": ["F, J, C", "C, J, F", "J, F, C", "F, C, J"], "ans": 0, "exp": "F < J et J < C → ordre croissant : F, J, C."}, {"id": "r041", "cat": "Raisonnement", "q": "Combien de triangles peut-on trouver dans un triangle divisé en 4 triangles égaux ?", "opts": ["5", "4", "6", "8"], "ans": 0, "exp": "On compte : les 4 petits triangles + le grand triangle entier = 5 triangles au total."}, {"id": "r042", "cat": "Raisonnement", "q": "Un carré est plié en deux puis en deux. On découpe un coin. Combien de trous y a-t-il après dépliage ?", "opts": ["4", "2", "8", "1"], "ans": 0, "exp": "Après 2 pliages, un point correspond à 4 points symétriques. Une découpe au coin crée 4 trous."}, {"id": "r043", "cat": "Raisonnement", "q": "Un escalier à 12 marches monte d'un étage. Si on monte 2 marches à la fois, combien de pas fait-on pour atteindre le sommet ?", "opts": ["6", "7", "5", "8"], "ans": 0, "exp": "12 marches ÷ 2 marches/pas = 6 pas."}, {"id": "r044", "cat": "Raisonnement", "q": "Si on retourne ce nombre : 1892, qu'obtient-on ?", "opts": ["2981", "1982", "9218", "2918"], "ans": 0, "exp": "Retourner un nombre = lire les chiffres en ordre inverse : 1892 → 2981."}, {"id": "r045", "cat": "Raisonnement", "q": "Combien de faces a un cube ?", "opts": ["6", "8", "4", "12"], "ans": 0, "exp": "Un cube a 6 faces carrées, 8 sommets et 12 arêtes."}, {"id": "r046", "cat": "Raisonnement", "q": "Un bureau a 5 agents. Chaque agent envoie un email à tous les autres. Combien d'emails sont envoyés au total ?", "opts": ["20", "25", "15", "10"], "ans": 0, "exp": "Chaque agent envoie 4 emails (à 4 autres). 5 × 4 = 20 emails."}, {"id": "r047", "cat": "Raisonnement", "q": "Dans une file d'attente, Marc est 5e depuis le début et 4e depuis la fin. Combien y a-t-il de personnes ?", "opts": ["8", "9", "7", "10"], "ans": 0, "exp": "Total = position depuis début + position depuis fin - 1 = 5 + 4 - 1 = 8 personnes."}, {"id": "r048", "cat": "Raisonnement", "q": "Un chiffre mystère est pair, divisible par 3, et inférieur à 20. Lequel ne peut PAS être ce chiffre ?", "opts": ["14", "12", "6", "18"], "ans": 0, "exp": "14 est pair mais 14/3 = 4,67 → pas divisible par 3. 14 ne répond pas aux critères."}, {"id": "r049", "cat": "Raisonnement", "q": "Laquelle de ces propositions est l'opposée de 'Tous les agents respectent le règlement' ?", "opts": ["Au moins un agent ne respecte pas le règlement", "Aucun agent ne respecte le règlement", "Tous les agents violent le règlement", "La plupart des agents respectent le règlement"], "ans": 0, "exp": "La négation de 'Tous les A sont B' est 'Il existe au moins un A qui n'est pas B'."}, {"id": "r050", "cat": "Raisonnement", "q": "Si A est plus grand que B, B est plus grand que C, et C est plus grand que D, quel est l'ordre décroissant ?", "opts": ["A, B, C, D", "D, C, B, A", "B, A, C, D", "A, C, B, D"], "ans": 0, "exp": "A > B > C > D → ordre décroissant : A, B, C, D."}, {"id": "r051", "cat": "Raisonnement", "q": "CRAYON est à MINE ce que STYLO est à ___", "opts": ["Encre", "Papier", "Gomme", "Plume"], "ans": 0, "exp": "La mine est la partie fonctionnelle du crayon. L'encre est la partie fonctionnelle du stylo."}, {"id": "r052", "cat": "Raisonnement", "q": "MÉDECIN est à STÉTHOSCOPE ce que CUISINIER est à ___", "opts": ["Couteau", "Tablier", "Fourneau", "Spatule"], "ans": 0, "exp": "Le stéthoscope est l'outil caractéristique du médecin. Le couteau (ou tout outil de coupe) est l'outil principal du cuisinier."}, {"id": "r053", "cat": "Raisonnement", "q": "Quel est l'intrus ? CARRÉ, CUBE, SPHÈRE, CYLINDRE, CÔNE", "opts": ["Carré", "Cube", "Sphère", "Cylindre"], "ans": 0, "exp": "Cube, Sphère, Cylindre et Cône sont des solides (3D). Le carré est une figure plane (2D)."}, {"id": "r054", "cat": "Raisonnement", "q": "Complétez : LUNE est à NUIT ce que SOLEIL est à ___", "opts": ["Jour", "Chaleur", "Étoile", "Lumière"], "ans": 0, "exp": "La lune est associée à la nuit. Le soleil est associé au jour."}, {"id": "r055", "cat": "Raisonnement", "q": "FRANCE est à PARIS ce que ESPAGNE est à ___", "opts": ["Madrid", "Barcelone", "Séville", "Valence"], "ans": 0, "exp": "Paris est la capitale de la France. Madrid est la capitale de l'Espagne."}, {"id": "r056", "cat": "Raisonnement", "q": "Quel est l'intrus ? ROUGE, VERT, BLEU, NOIR, CHAUD", "opts": ["Chaud", "Rouge", "Bleu", "Noir"], "ans": 0, "exp": "Rouge, Vert, Bleu et Noir sont des couleurs. CHAUD est une sensation thermique."}, {"id": "r057", "cat": "Raisonnement", "q": "Complétez : PLUIE est à PARAPLUIE ce que SOLEIL est à ___", "opts": ["Lunettes de soleil", "Chapeau", "Crème solaire", "Parasol"], "ans": 3, "exp": "Le parapluie protège de la pluie. Le parasol protège du soleil (par analogie directe de nom et de fonction)."}, {"id": "r058", "cat": "Raisonnement", "q": "Quel est l'intrus ? MÈTRE, GRAMME, LITRE, DEGRÉ, HEURE", "opts": ["Heure", "Mètre", "Litre", "Gramme"], "ans": 0, "exp": "Mètre, Gramme, Litre et Degré sont des unités du système métrique/SI. L'heure est une unité de temps non décimale (60 min)."}, {"id": "r059", "cat": "Raisonnement", "q": "Complétez : PRINTEMPS est à ÉTÉ ce qu'AUTOMNE est à ___", "opts": ["Hiver", "Été", "Printemps", "Saison"], "ans": 0, "exp": "Le printemps précède l'été. L'automne précède l'hiver."}, {"id": "r060", "cat": "Raisonnement", "q": "Quel est l'intrus ? TABLE, CHAISE, BUREAU, LAMPE, CANAPÉ", "opts": ["Lampe", "Table", "Chaise", "Canapé"], "ans": 0, "exp": "Table, Chaise, Bureau et Canapé sont des meubles. La lampe est un appareil d'éclairage."}, {"id": "r061", "cat": "Raisonnement", "q": "Un fonctionnaire dit : 'Je mens toujours'. Est-il en train de dire la vérité ?", "opts": ["C'est un paradoxe sans réponse logique valide", "Oui, il ment", "Non, il dit la vérité", "Les deux sont possibles"], "ans": 0, "exp": "Il s'agit du paradoxe du menteur : si la phrase est vraie, il ment donc la phrase est fausse ; si elle est fausse, il dit la vérité donc la phrase est vraie. C'est un paradoxe."}, {"id": "r062", "cat": "Raisonnement", "q": "Dans une série de codes : 2B, 4D, 6F, quelle est la valeur suivante ?", "opts": ["8H", "8G", "10H", "7G"], "ans": 0, "exp": "Chiffres : 2, 4, 6 (+2 à chaque fois) → 8. Lettres : B(2), D(4), F(6) → H(8). Réponse : 8H."}, {"id": "r063", "cat": "Raisonnement", "q": "Complétez la série : AB, CD, EF, GH, ___", "opts": ["IJ", "JK", "HI", "KL"], "ans": 0, "exp": "La série regroupe les lettres de l'alphabet par paires successives. Après GH vient IJ."}, {"id": "r064", "cat": "Raisonnement", "q": "Si CHAT se code FKDW (chaque lettre avancée de 3), comment se code CHIEN ?", "opts": ["FKLHQ", "FKLGQ", "EKKHQ", "FKLQH"], "ans": 0, "exp": "C+3=F, H+3=K, I+3=L, E+3=H, N+3=Q. Code : FKLHQ."}, {"id": "r065", "cat": "Raisonnement", "q": "Un nombre entre 1 et 10 est impair, supérieur à 5, et pas 7. Quel est-il ?", "opts": ["9", "5", "3", "7"], "ans": 0, "exp": "Impairs > 5 : 7, 9. Pas 7 → 9."}, {"id": "r066", "cat": "Raisonnement", "q": "Combien y a-t-il de carrés dans une grille 3×3 ?", "opts": ["14", "9", "16", "12"], "ans": 0, "exp": "Carrés 1×1 : 9. Carrés 2×2 : 4. Carré 3×3 : 1. Total = 14."}, {"id": "r067", "cat": "Raisonnement", "q": "Si A < B, B = C, et C < D, quelle inégalité est vraie ?", "opts": ["A < D", "A = D", "D < A", "B > D"], "ans": 0, "exp": "A < B = C < D → A < D."}, {"id": "r068", "cat": "Raisonnement", "q": "Un code à 4 chiffres distincts, tous pairs, tous inférieurs à 8. Combien y a-t-il de chiffres disponibles ?", "opts": ["4", "3", "5", "6"], "ans": 0, "exp": "Chiffres pairs < 8 : 0, 2, 4, 6 → 4 chiffres disponibles."}, {"id": "r069", "cat": "Raisonnement", "q": "Laquelle de ces affirmations est une déduction valide ? Prémisse : 'Tous les chiens aboient.' Situation : 'Rex n'aboie pas.'", "opts": ["Rex n'est pas un chien", "Rex est malade", "Rex est peut-être un chien", "Rex est silencieux"], "ans": 0, "exp": "Si tous les chiens aboient et que Rex n'aboie pas, on peut déduire par contraposée que Rex n'est pas un chien."}, {"id": "r070", "cat": "Raisonnement", "q": "Classez du plus petit au plus grand : 3/4, 0,7, 70%, 0,72.", "opts": ["3/4 < 0,7 < 70% < 0,72", "0,7 = 70% < 3/4 < 0,72", "0,7 < 70% < 0,72 < 3/4", "3/4 > 0,72 > 70% = 0,7"], "ans": 3, "exp": "3/4 = 0,75. 0,7 = 70%. 0,72 < 0,75. Ordre croissant : 0,7 = 70% < 0,72 < 3/4 = 0,75."}, {"id": "r071", "cat": "Raisonnement", "q": "Un dossier nécessite 3 pièces obligatoires et 2 pièces optionnelles. Un candidat fournit les 3 obligatoires mais aucune optionnelle. Son dossier est-il recevable ?", "opts": ["Oui, car les pièces obligatoires sont présentes", "Non, car le dossier est incomplet", "Cela dépend de l'administration", "Non, car les optionnelles sont importantes"], "ans": 0, "exp": "Par définition, les pièces obligatoires sont nécessaires et suffisantes pour la recevabilité ; les pièces optionnelles sont, par nature, facultatives."}, {"id": "r072", "cat": "Raisonnement", "q": "Une procédure indique : 'Délai de 30 jours à compter de la réception'. Un courrier est reçu le 5 mars. Quand expire le délai ?", "opts": ["4 avril", "5 avril", "3 avril", "6 avril"], "ans": 0, "exp": "Le délai de 30 jours courant à compter du 5 mars expire le 4 avril (le 5 mars est le jour 0, le délai expire 30 jours plus tard)."}, {"id": "r073", "cat": "Raisonnement", "q": "Si une règle dit 'Les agents de grade A ont priorité sur les agents de grade B, qui ont priorité sur les agents de grade C', qui passe en premier parmi : un agent C, un agent B et un agent A ?", "opts": ["L'agent A", "L'agent B", "L'agent C", "Ils sont à égalité"], "ans": 0, "exp": "Selon la règle : A > B > C → l'agent de grade A est prioritaire."}, {"id": "r074", "cat": "Raisonnement", "q": "Un formulaire précise : 'Cocher au moins une case parmi les options suivantes'. Un candidat ne coche aucune case. Que se passe-t-il ?", "opts": ["Le formulaire est invalide", "Le formulaire est valide par défaut", "Les cases sont cochées automatiquement", "Cela dépend du formulaire"], "ans": 0, "exp": "L'instruction 'au moins une case' e // ══ CONSTANTS ════════════════════════════════════════════════
const CATS = ["Toutes","Orthographe","Culture générale","Calcul","Raisonnement"];
const QUOTAS = {"Orthographe":0.30,"Culture générale":0.28,"Calcul":0.24,"Raisonnement":0.18};
const CAT_TAGS = {"Orthographe":"orth","Culture générale":"cult","Calcul":"calc","Raisonnement":"rais"};
const CAT_COLORS = {
  "Orthographe":{"bg":"#EEF2FF","border":"#6366F1","text":"#4338CA","fill":"#6366F1"},
  "Culture générale":{"bg":"#ECFDF5","border":"#16A34A","text":"#065F46","fill":"#16A34A"},
  "Calcul":{"bg":"#FFF7ED","border":"#EA580C","text":"#C2410C","fill":"#EA580C"},
  "Raisonnement":{"bg":"#FDF4FF","border":"#9333EA","text":"#7E22CE","fill":"#9333EA"}
};
const SESSION_SIZE = 54;
const LS_KEY = "douanes_leitner_v2";

// ══ LEITNER SYSTEM ════════════════════════════════════════════
// Each question has a "box" (0-4). Higher box = shown less often.
// Box 0: every session, Box 1: every 2, Box 2: every 4, Box 3: every 8, Box 4: mastered (rare)
function loadLeitner() {
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; }
}
function saveLeitner(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)); } catch {}
}
function getLeitnerBox(id, leitner) { return leitner[id]?.box ?? 0; }
function getSessionCount(leitner) { return leitner["__session__"] ?? 0; }
function updateLeitner(id, correct, leitner) {
  const cur = leitner[id] || {box:0, seen:0, correct:0};
  cur.seen = (cur.seen||0) + 1;
  if (correct) {
    cur.correct = (cur.correct||0) + 1;
    cur.box = Math.min((cur.box||0) + 1, 4);
  } else {
    cur.box = Math.max((cur.box||0) - 1, 0);
  }
  leitner[id] = cur;
}
function shouldShowQuestion(id, leitner) {
  const box = getLeitnerBox(id, leitner);
  const session = getSessionCount(leitner);
  const intervals = [1, 2, 4, 8, 20];
  return session % intervals[box] === 0;
}
function getDifficulty(id, leitner) {
  const d = leitner[id];
  if (!d || d.seen === 0) return null;
  const rate = d.correct / d.seen;
  if (rate >= 0.8) return "easy";
  if (rate >= 0.5) return "med";
  return "hard";
}
function getDifficultyLabel(id, leitner) {
  const diff = getDifficulty(id, leitner);
  if (!diff) return "";
  const map = {easy:"✓ Maîtrisé",med:"~ En progrès",hard:"✗ Difficile"};
  return map[diff];
}

// ══ SHUFFLE ══════════════════════════════════════════════════
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// ══ SESSION BUILDER ═══════════════════════════════════════════
function buildSession(catFilter, leitner) {
  let pool;
  if (catFilter === "Toutes") {
    // Respect quotas
    pool = [];
    Object.entries(QUOTAS).forEach(([cat, ratio]) => {
      const catQ = ALL_Q.filter(q => q.cat === cat);
      const n = Math.round(SESSION_SIZE * ratio);
      // Prioritize unseen/difficult questions
      const sorted = [...catQ].sort((a,b) => {
        const boxA = getLeitnerBox(a.id, leitner);
        const boxB = getLeitnerBox(b.id, leitner);
        return boxA - boxB; // lower box = more urgent
      });
      pool.push(...shuffle(sorted).slice(0, n));
    });
  } else {
    const catQ = ALL_Q.filter(q => q.cat === catFilter);
    const sorted = [...catQ].sort((a,b) => getLeitnerBox(a.id,leitner) - getLeitnerBox(b.id,leitner));
    pool = shuffle(sorted).slice(0, SESSION_SIZE);
  }
  return shuffle(pool);
}

// ══ SHUFFLE OPTIONS ════════════════════════════════════════════
function shuffleOpts(q) {
  const indexed = q.opts.map((o,i) => ({label:o, orig:i}));
  return shuffle(indexed);
}

// ══ STATE ════════════════════════════════════════════════════
let leitner = loadLeitner();
let catFilter = "Toutes";
let deck = [];
let idx = 0;
let answered = false;
let score = 0;
let total = 0;
let curOpts = [];
let phase = "quiz"; // quiz | end
let history = [];

// ══ INIT ══════════════════════════════════════════════════════
function init(cat) {
  catFilter = cat;
  leitner["__session__"] = (leitner["__session__"] || 0) + 1;
  saveLeitner(leitner);
  deck = buildSession(cat, leitner);
  idx = 0; answered = false; score = 0; total = 0;
  history = []; phase = "quiz";
  if (deck.length) curOpts = shuffleOpts(deck[0]);
  updateHeader();
  buildFilters();
  render();
}

// ══ HEADER ════════════════════════════════════════════════════
function updateHeader() {
  document.getElementById("hScore").textContent = score;
  document.getElementById("hTotal").textContent = total;
  const pct = deck.length ? (idx/deck.length)*100 : 0;
  document.getElementById("progressBar").style.width = pct + "%";
}

// ══ FILTER BAR ════════════════════════════════════════════════
function buildFilters() {
  const row = document.getElementById("filterRow");
  const cats = CATS;
  row.innerHTML = cats.map((c,i) => {
    const isOn = c === catFilter;
    const quota = QUOTAS[c] ? `<span style="opacity:.6;font-size:9px;margin-left:3px">${Math.round(QUOTAS[c]*100)}%</span>` : "";
    return `<button class="fbtn${isOn?" on":""}" onclick="init('${c}')">${c}${quota}</button>${i===0?'<div class="fsep"></div>':""}`;
  }).join("");
}

// ══ RENDER QUIZ ═══════════════════════════════════════════════
function render() {
  const main = document.getElementById("main");
  if (phase === "end") { renderEnd(); return; }
  if (!deck.length || idx >= deck.length) { renderEnd(); return; }

  const q = deck[idx];
  const tagClass = "tag tag-" + (CAT_TAGS[q.cat] || "orth");
  const diff = getDifficulty(q.id, leitner);
  const diffLabel = getDifficultyLabel(q.id, leitner);
  const diffClass = diff ? `difficulty-badge d-${diff}` : "";

  // Stats
  const pct = total > 0 ? Math.round(score/total*100) : 0;
  const errors = total - score;

  main.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="stat-val">${deck.length}</div><div class="stat-lbl">Questions</div></div>
      <div class="stat"><div class="stat-val g">${score}</div><div class="stat-lbl">Correctes</div></div>
      <div class="stat"><div class="stat-val r">${errors}</div><div class="stat-lbl">Erreurs</div></div>
      <div class="stat"><div class="stat-val">${pct}%</div><div class="stat-lbl">Réussite</div></div>
    </div>

    <div class="meta">
      <span class="${tagClass}">${q.cat}</span>
      ${diffLabel ? `<span class="${diffClass}">${diffLabel}</span>` : ""}
      <span class="q-counter">${idx+1} / ${deck.length}</span>
    </div>

    <div class="q-card"><div class="q-text">${q.q}</div></div>

    <div class="options" id="opts">
      ${curOpts.map((o,i) => `
        <button class="opt" id="o${i}" onclick="pick(${i})">
          <div class="opt-num">${i+1}</div>
          <div class="opt-text">${o.label}</div>
        </button>`).join("")}
    </div>

    <div id="fb"></div>

    <div class="actions" id="acts" style="display:none">
      <button class="btn btn-ghost" onclick="next()">Passer →</button>
      <button class="btn btn-primary" onclick="next()">Question suivante →</button>
    </div>`;
}

// ══ PICK ══════════════════════════════════════════════════════
function pick(i) {
  if (answered) return;
  answered = true; total++;
  const q = deck[idx];
  const opt = curOpts[i];
  const correct = opt.orig === q.ans;
  if (correct) score++;
  updateLeitner(q.id, correct, leitner);
  saveLeitner(leitner);
  updateHeader();

  // Style options
  document.querySelectorAll(".opt").forEach((el, j) => {
    el.classList.add("disabled");
    if (curOpts[j].orig === q.ans) el.classList.add(correct && j===i ? "correct" : "show-ok");
    if (j===i && !correct) el.classList.add("wrong");
  });

  // Feedback
  const fb = document.getElementById("fb");
  fb.innerHTML = `
    <div class="feedback">
      <div class="fb-head">
        <div class="fb-icon ${correct?"ok":"ko"}">${correct?"✓":"✗"}</div>
        <div class="fb-title ${correct?"ok":"ko"}">${correct?"Bonne réponse !":"Réponse incorrecte"}</div>
      </div>
      <div class="fb-body">
        <div class="fb-label">✦ Explication</div>
        <div class="fb-text" id="expl"><span class="spinner"></span>Génération…</div>
      </div>
    </div>`;

  history.push({q:q.q, cat:q.cat, correct, correctLabel:q.opts[q.ans], chosenLabel:opt.label, exp:q.exp});
  document.getElementById("acts").style.display = "flex";
  loadExpl(q, opt, correct);
}

// ══ EXPLANATION ═══════════════════════════════════════════════
async function loadExpl(q, opt, correct) {
  const el = document.getElementById("expl");
  if (!el) return;
  // Use built-in explanation first (instant)
  if (q.exp) { el.textContent = q.exp; return; }
  // Fallback: Claude API
  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514", max_tokens:300,
        messages:[{role:"user",content:`Explication pédagogique courte (2-3 phrases) pour cette question du concours C des douanes.\nQuestion: "${q.q}"\nBonne réponse: "${q.opts[q.ans]}"\nRéponse choisie: "${opt.label}" (${correct?"correcte":"incorrecte"})\nRéponds directement en français, sans introduction.`}]
      })
    });
    const d = await res.json();
    const t = d.content?.map(b=>b.text||"").join("").trim();
    if (t && el) el.textContent = t;
  } catch { if (el) el.textContent = `Réponse correcte : ${q.opts[q.ans]}`; }
}

// ══ NEXT ══════════════════════════════════════════════════════
function next() {
  idx++; answered = false;
  if (idx >= deck.length) { phase = "end"; renderEnd(); return; }
  curOpts = shuffleOpts(deck[idx]);
  updateHeader(); render();
  window.scrollTo({top:0,behavior:"smooth"});
}

// ══ END SCREEN ════════════════════════════════════════════════

  document.getElementById("progressBar").style.width = "100%";
  const pct = total > 0 ? Math.round(score/total*100) : 0;

  // Leitner progress
  const boxes = [0,0,0,0,0];
  ALL_Q.forEach(q => { boxes[getLeitnerBox(q.id, leitner)]++; });
  const leitnerHTML = `
    <div style="margin-bottom:20px;padding:14px 16px;background:#F8FAFC;border:1px solid var(--border);border-radius:var(--radius)">
      <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Progression Leitner (sur 500 questions)</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${[
          {label:"Non vues",color:"#94A3B8"},
          {label:"Box 1",color:"#F97316"},
          {label:"Box 2",color:"#EAB308"},
          {label:"Box 3",color:"#3B82F6"},
          {label:"Maîtrisées",color:"#22C55E"}
        ].map((b,i) => `<span style="font-size:11px;padding:3px 8px;border-radius:12px;background:${b.color}20;color:${b.color};border:1px solid ${b.color}40;font-weight:500">${b.label}: ${boxes[i]}</span>`).join("")}
      </div>
    </div>`;

  document.getElementById("main").innerHTML = `
    <div class="end">
      <div style="font-size:48px;margin-bottom:12px">${trophy}</div>
      <div class="end-pct">${pct}%</div>
      <div class="end-msg" style="color:${msgColor}">${msg}</div>
      <div class="end-detail">${score} bonne${score>1?"s":""} réponse${score>1?"s":""} sur ${total} questions</div>
      <div class="end-cats">${catsHTML}</div>
      ${leitnerHTML}
      <div class="end-btns">
        <button class="end-btn end-btn-main" onclick="init(catFilter)">Nouvelle session (questions différentes)</button>
        <button class="end-btn end-btn-sec" onclick="resetLeitner()">Réinitialiser la progression</button>
      </div>
    </div>`;
}

// ══ RESET ════════════════════════════════════════════════════
function resetLeitner() {
  if (!confirm("Réinitialiser toute la progression Leitner ?")) return;
  localStorage.removeItem(LS_KEY);
  leitner = {};
  init(catFilter);
}

// ══ START ═════════════════════════════════════════════════════
buildFilters();
init("Toutes");
</script>
</body>
</html>
